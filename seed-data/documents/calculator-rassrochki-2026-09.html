<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рассрочка Сер. Бор и Зорге</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style id="css">
:root{
  color-scheme:light;
  --bg:#FAF8F6; --surface:#FFFFFF; --track:#F0EAE4; --row:#F5EFEA; --ink:#231B17; --ink-2:#6C5C53;
  --line:#E7DED6; --brand:#A27562; --accent:#8C5E49; --accent-soft:#F4E9E2;
  --good:#2F6A52; --good-soft:#E4F0EA; --bad:#A3412B; --bad-soft:#F9E7E1;
  --shadow:0 1px 2px rgba(70,40,25,.05),0 6px 20px rgba(70,40,25,.06);
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
@media (min-width:700px){.wrap{padding-inline:28px}}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 24px;margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:10px;min-width:0}
.brand img{height:30px;width:auto;max-width:100%;object-fit:contain;object-position:left}
@media (min-width:700px){.brand img{height:38px}}
.brand p{margin:0;color:var(--ink-2);font-size:14px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{min-height:44px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#7A503D}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:wait}
.btn svg{width:18px;height:18px;flex:none}

/* segmented track (как на карточке прайсовых условий) */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.lbl{font-weight:600;font-size:14px;padding:0;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--track);border-radius:14px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1 1 auto;min-height:44px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink-2);text-align:center;transition:background .15s,color .15s,box-shadow .15s;user-select:none}
.seg label:hover{color:var(--ink)}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(60,35,20,.12)}
.seg input:focus-visible+label{outline:3px solid var(--accent);outline-offset:1px}
.seg input:disabled+label{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.seg.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.seg.grid label{padding:8px 4px;min-width:0}
.seg.stack{flex-direction:column}
.seg.stack label{justify-content:flex-start;text-align:left}
.seg.projects{max-width:560px}
.seg.projects label{font-size:15px}

.layout{display:grid;gap:24px;align-items:start}
@media (min-width:960px){.layout{grid-template-columns:390px 1fr}}
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:22px}
@media (min-width:960px){.panel.form{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}
.field{display:flex;flex-direction:column;gap:8px}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:48px;padding-inline:14px;gap:8px}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.money input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:600 18px var(--font);font-variant-numeric:tabular-nums;outline:none;padding-block:10px}
.money span{color:var(--ink-2);font-weight:500}
.field.err .money{border-color:var(--bad)}
.msg{color:var(--bad);font-size:13px;margin:0}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.range-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.hint-btn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--track);color:var(--ink-2);font:600 13px var(--font);cursor:pointer;display:inline-grid;place-items:center;padding:0;position:relative}
.hint-btn::after{content:"";position:absolute;inset:-10px}
.hint-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint-btn[aria-expanded="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{font-size:13px;color:var(--ink-2);background:var(--track);border-radius:10px;padding:10px 12px;margin:0}
.note{font-size:13px;color:var(--ink-2);margin:0}
.fixed{font-size:14px;color:var(--ink-2);background:var(--track);border-radius:10px;padding:11px 12px;margin:0}

/* results */
.results{display:flex;flex-direction:column;gap:20px;min-width:0}
.cols{display:grid;gap:16px}
@media (min-width:700px){.cols.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.soft{background:var(--row);box-shadow:none}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 10px;flex-wrap:wrap}
.cols.two .card-head{flex-direction:column;align-items:flex-start}
.card-head h2{font-size:17px;font-weight:600;margin:0}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.hero-lbl{font-size:13px;color:var(--ink-2);font-weight:500;margin:0}
.hero{font:600 clamp(32px,4.4vw,44px)/1.05 var(--font);letter-spacing:-.02em;margin:2px 0 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .kop{font-size:.5em;font-weight:500;color:var(--ink-2);letter-spacing:0}
.hero-sub{font-size:14px;color:var(--ink-2);margin:4px 0 0}
.split{display:flex;flex-direction:column;gap:10px}
.split-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--track);gap:2px}
.split-bar i{display:block;height:100%;min-width:3px}
.c-pv{background:#8C5E49}.c-rest{background:#D9BBA2}.c-dvou{background:#B39584}
.c-save{background:repeating-linear-gradient(135deg,#CFE4D7 0 4px,#E9F3ED 4px 8px)}
.split-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.split-legend li{display:flex;align-items:center;gap:6px}
.split-legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.split-legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;margin:0}
.rows>div{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-top:1px solid var(--line)}
.rows dt{color:var(--ink-2)}
.rows dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rows>div.total dt{color:var(--ink);font-weight:600}
.rows>div.total dd{font-size:17px}
.flag{font-size:12.5px;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:8px 10px;margin:0}
.diff{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.diff>div{display:flex;flex-direction:column;gap:2px}
.diff .k{font-size:13px;color:var(--ink-2)}
.diff .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--bad)}

/* schedule block */
.sched{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sched-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px 16px 22px}
.sched-head h2{font-size:17px;font-weight:600;margin:0}
.sched-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.variant{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:0 22px 14px}
.variant .seg{flex:0 1 auto}
.variant .seg label{min-height:40px;padding:6px 12px;font-size:14px}
.variant span{font-size:13px;color:var(--ink-2)}
.toggle{width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 22px;min-height:48px;text-align:left;cursor:pointer;color:var(--accent);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.toggle:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.toggle .chev{transition:transform .2s}
.toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tbl-wrap{overflow-x:auto;padding:0 12px 16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:520px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12.5px;font-weight:600;color:#fff;background:var(--accent);text-align:right;padding:9px 10px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:nth-child(odd){background:var(--row)}
.tbl tr.last td{font-weight:600}
.tbl td.pos{color:var(--bad)} .tbl td.neg{color:var(--good)}
.err-box{background:var(--bad-soft);color:var(--bad);border-radius:16px;padding:18px 22px;font-weight:500}
footer.fine{color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:4px;margin-top:24px}
footer.fine strong{color:var(--ink)}

/* dialog: прайсовые условия */
dialog.prices{border:0;border-radius:18px;padding:0;width:min(880px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(40,20,10,.25)}
dialog.prices::backdrop{background:rgba(35,27,23,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-head{padding:22px 22px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.dlg-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-title h2{margin:0;font-size:22px;font-weight:600}
.dlg-title .x{width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-size:26px;line-height:1;color:var(--ink-2)}
.dlg-title .x:focus-visible{outline:3px solid var(--accent)}
.dlg-head p{margin:0;font-size:13px;color:var(--ink-2)}
.dlg-body{overflow:auto;padding:14px 22px 22px;display:flex;flex-direction:column;gap:22px}
.dlg-foot{border-top:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.dlg-foot .grow{flex:1;font-size:13px;color:var(--ink-2)}
.ptable h3{font-size:15px;font-weight:600;margin:0 0 6px}
.ptable .scroll{overflow-x:auto}
.ptable table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:460px}
.ptable th{font-size:12px;font-weight:500;color:var(--ink-2);padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.ptable th:first-child{text-align:left}
.ptable td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
.ptable td:first-child{text-align:left;color:var(--ink-2)}
.ptable td input{width:100%;max-width:74px;min-height:36px;border:1px solid var(--line);border-radius:8px;text-align:center;font:500 14px var(--font);font-variant-numeric:tabular-nums;background:var(--surface);color:var(--ink)}
.ptable td input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.ptable td input.bad{border-color:var(--bad);background:var(--bad-soft)}
.ptable .rm{border:0;background:transparent;color:var(--bad);cursor:pointer;min-width:36px;min-height:36px;border-radius:8px;font-size:18px}
.ptable .add{display:flex;gap:8px;align-items:center;margin-top:8px}
.ptable .add input{width:90px;min-height:40px;border:1px solid var(--line);border-radius:10px;padding-inline:10px;font:inherit}
.kv{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kv label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.kv input{min-height:42px;border:1px solid var(--line);border-radius:10px;padding-inline:12px;font:500 15px var(--font);color:var(--ink)}
.oneline{font-size:14px;margin:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.oneline b{font-variant-numeric:tabular-nums}
.pw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pw input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding-inline:12px;font:inherit;min-width:0;flex:1 1 180px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.copybox{width:100%;min-height:160px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px}

/* sticky mobile */
.sticky{display:none}
@media (max-width:959px){
  .sticky{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.07);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;gap:12px}
  .sticky .s-l{font-size:12px;color:var(--ink-2)}
  .sticky .s-v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sticky .s-v small{font-size:13px;font-weight:500;color:var(--ink-2)}
  body{padding-bottom:84px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}

/* лист для PDF */
.sheet{position:fixed;left:-20000px;top:0;width:794px;background:#fff;color:#231B17;font:400 13px/1.4 var(--font);padding:44px 52px 40px}
.sheet.wide{width:1123px}
.sheet .s-logo{height:30px;width:auto;display:block;margin-bottom:22px}
.sheet .s-cols{display:grid;gap:36px}
.sheet.wide .s-cols{grid-template-columns:1fr 1fr}
.sheet h1{font-size:26px;font-weight:400;margin:0 0 2px}
.sheet .s-sub{font-size:13px;color:#6C5C53;margin:0 0 10px;min-height:18px}
.sheet .s-meta{display:flex;justify-content:space-between;gap:12px;margin:8px 0 14px;font-size:12.5px}
.sheet .s-meta span:last-child{color:#7B6B62}
.sheet h3{font-size:13px;font-weight:600;margin:0 0 6px}
.sheet table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sheet .s-kv td{border:1px solid #E9DDD4;padding:5px 9px;font-size:12px}
.sheet .s-kv td:last-child{text-align:right}
.sheet .s-kv tr:nth-child(odd){background:#F2E8E1}
.sheet .s-kv tr.b td{font-weight:700;font-size:13.5px;background:#fff}
.sheet .s-gr{margin-top:18px}
.sheet .s-gr th{background:#9E6D58;color:#fff;font-weight:600;font-size:12px;padding:8px 9px;border:1px solid #fff}
.sheet .s-gr td{padding:5px 9px;font-size:12px;text-align:right;border:1px solid #E9DDD4}
.sheet .s-gr td:first-child{text-align:center}
.sheet .s-gr tbody tr:nth-child(even){background:#F2E8E1}
.sheet .s-foot{margin-top:18px;font-size:10.5px;color:#7B6B62}
.sheet.wide h1{font-size:22px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.nojs{max-width:560px;margin:48px auto;padding-inline:20px;font:400 16px/1.55 var(--font);color:var(--ink)}
.nojs h1{font-size:22px;margin:0 0 12px}
.nojs li{margin-bottom:6px}
</style>

</head>
<body>
<div class="nojs" id="nojs"><h1>Калькулятор рассрочки</h1>
<p>Этот просмотр не запускает калькулятор: встроенный предпросмотр файлов на телефоне не выполняет скрипты.</p>
<ul><li>На компьютере — откройте файл двойным щелчком в браузере (Chrome, Safari, Edge).</li>
<li>На телефоне — откройте калькулятор по ссылке в Claude или на сайте.</li></ul></div>
<template id="shell">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img id="logo" alt="">
      <p>Калькулятор рассрочки · расчёт обновляется сразу</p>
    </div>
    <div class="top-actions">
      <button type="button" class="btn" id="open-prices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M9.5 9.5v10"/></svg>
        Прайсовые условия
      </button>
    </div>
  </header>
  <fieldset style="margin-bottom:20px">
    <legend class="sr">Объект</legend>
    <div class="seg projects" id="projects"></div>
  </fieldset>
  <div class="layout">
    <form class="panel form" id="form" novalidate></form>
    <section class="results" id="results" aria-live="polite"></section>
  </div>
  <footer class="fine">
    <strong>Расчёт предварительный, точные условия — в договоре.</strong>
    <span>Расчёт по рассрочке не является публичной офертой без оплаченного договора возмездного оказания услуг на бронирование объекта недвижимости.</span>
  </footer>
</div>
<div class="sticky" id="sticky" aria-hidden="true"></div>
<dialog class="prices" id="prices" aria-labelledby="prices-title"><div class="dlg" id="dlg"></div></dialog>

<script id="engine">
/* ================= РАСЧЁТ (формулы 1-в-1 с Excel) =================
   Условия (ставки) хранятся в блоке <script id="conditions"> выше, в формате JSON.
   Их удобнее менять кнопкой «Прайсовые условия → Редактировать».  */
var CONFIG = (typeof document !== "undefined" && document.getElementById("conditions")) ? JSON.parse(document.getElementById("conditions").textContent) : null;
function setConfig(c){ CONFIG = c; }

// Округление как в Excel: половина — от нуля, по 15 значащим цифрам
function xround(x, n){ var f = Math.pow(10,n); var v = Number((Math.abs(x)*f).toPrecision(15)); return Math.sign(x)*Math.round(v)/f; }

function lookupRow(tbl, term, pvList, pv){
  if(tbl === null || tbl === undefined) return null;
  if(typeof tbl === "number") return tbl;
  var row = tbl[String(term)];
  if(row === undefined) return null;
  if(typeof row === "number") return row;
  var i = pvList.indexOf(pv);
  if(i < 0) return null;
  var v = row[i];
  return (v === null || v === undefined) ? null : v;
}

// ПВ, затем платежи; последний платёж = весь остаток; остановка, когда остаток округляется до 0 (как в Excel)
function buildSchedule(S, PV, regular, count){
  var rows = [], paid = PV;
  rows.push({ n:"ПВ", pay:PV, paid:paid, rest:S - paid });
  for(var k=1; k<=count; k++){
    var prevRest = rows[rows.length-1].rest;
    if(xround(prevRest,2) === 0) break;
    var pay = (k < count) ? regular : prevRest;
    paid = paid + pay;
    rows.push({ n:k, pay:pay, paid:paid, rest:S - paid });
  }
  return rows;
}

// Квартиры (Сер. Бор, Зорге) — лист «График выплаты …»
function calcFlat(a){
  var price=a.price, dvou=a.dvou, pv=a.pv, term=a.term, program=a.program, discount=a.discount;
  var P1 = price - price*discount;   // D8  цена со скидкой
  var S  = P1 - dvou;                // D16 итоговая цена
  var PV = S*pv;                     // D11 первый взнос
  var regular, count;
  if(program === "half"){ regular = S*0.005*1; count = term; }
  else if(program === "quarterly"){ regular = (S-PV)/term*3; count = term/3; }
  else if(program === "tenten"){ regular = S*0.1; count = 3; }
  else { regular = (S-PV)/term*1; count = term; }
  var schedule = buildSchedule(S, PV, regular, count);
  var last = schedule[schedule.length-1];
  return { discount:discount, discountRub:price*discount, P1:P1, dvou:dvou, S:S, PV:PV, regular:regular, last:last.pay, count:schedule.length-1, schedule:schedule, total:P1 };
}

// Машино-места — лист «График выплаты ММ Зорге»
function calcParking(a){
  var cfg = CONFIG.parking, price=a.price, dop=a.dop, pv=a.pv, term=a.term, program=a.program, corr=a.corr;
  var full = pv === 1;
  var P1 = full ? null : price - price*corr;
  var S  = full ? price - price*cfg.fullPaymentDiscount : P1 - price*dop;
  var PV = S*pv, regular = 0, count = 0;
  if(!full){
    if(program === "p25"){ regular = S*0.025*1; count = term; }
    else if(program === "quarterly"){ regular = (S-PV)/term*3; count = term/3; }
    else { regular = (S-PV)/term*1; count = term; }
  }
  var schedule = full ? [{n:"Оплата", pay:S, paid:S, rest:0}] : buildSchedule(S, PV, regular, count);
  var markup = full ? null : P1 - (price - price*cfg.markupBase);
  return { corr:corr, full:full, P1:P1, dopRub: full ? 0 : price*dop, S:S, PV:PV, regular:regular, last:schedule[schedule.length-1].pay, count:schedule.length-1, schedule:schedule, markup:markup, total:S };
}

// Сер. Бор: стандартная скидка и «15%»; если на листе 15% нет срока — стандартная минус fallbackDelta
function serborDiscounts(program, term, pv){
  var c = CONFIG.serbor;
  var std = lookupRow(c.standard[program], term, c.pv, pv);
  var red = lookupRow(c.reduced[program], term, c.pv, pv), estimated = false;
  if(red === null && std !== null){ red = std - c.reduced.fallbackDelta; estimated = true; }
  return { std:std, red:red, estimated:estimated };
}
if(typeof module !== "undefined") module.exports = { setConfig:setConfig, xround:xround, calcFlat:calcFlat, calcParking:calcParking, serborDiscounts:serborDiscounts, lookupRow:lookupRow };
</script>
<script id="app">
(function boot(){
if(!document.body){ document.addEventListener("DOMContentLoaded", boot); return; }
var nojs = document.getElementById("nojs"); if(nojs) nojs.remove();
document.body.prepend(document.getElementById("shell").content.cloneNode(true));
var ASSETS = JSON.parse(document.getElementById("assets").textContent);
var $ = function(s){ return document.querySelector(s); };
var nf0 = new Intl.NumberFormat("ru-RU",{minimumFractionDigits:0,maximumFractionDigits:0});
var nf2 = new Intl.NumberFormat("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});
var pctf = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
function rub(x,d){ return (d ? nf2.format(xround(x,2)) : nf0.format(xround(x,0))) + " ₽"; }
function pct(x){ return pctf.format(xround(x*100,2)) + "%"; }
function signed(x,d){ var r = xround(x,d||0); return (r>0?"+":r<0?"−":"") + rub(Math.abs(x),d); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function cap(name){ try{ return (window.claude && window.claude.use) ? window.claude.use(name) : Promise.resolve(null); }catch(e){ return Promise.resolve(null); } }

var state = {
  project:"serbor", exportVariant:"std", schedOpen:false,
  serbor:  { program:"half", price:CONFIG.serbor.defaultPrice, dvou:CONFIG.serbor.dvou, pv:0.3, term:18 },
  zorge:   { program:"monthly", lot:"oneRoom", price:CONFIG.zorge.defaultPrice, dvou:CONFIG.zorge.dvou, pv:0.3, term:12 },
  parking: { program:"monthly", price:CONFIG.parking.defaultPrice, dop:0, pv:0.4, term:12 }
};
try{ var sp = localStorage.getItem("rs-project"); if(sp && CONFIG[sp] && sp !== "admin") state.project = sp; }catch(e){}
var PROJECTS = ["serbor","zorge","parking"];

/* ---------- доступные варианты ---------- */
function sortedKeys(o){ return Object.keys(o||{}).map(Number).sort(function(a,b){return a-b;}); }
function termsFor(p, s){
  if(p === "serbor"){ var pr = CONFIG.serbor.programs[s.program]; return pr.fixedTerm ? [pr.fixedTerm] : sortedKeys(CONFIG.serbor.standard[s.program]); }
  if(p === "zorge") return sortedKeys(CONFIG.zorge.lots[s.lot][s.program]);
  return sortedKeys(CONFIG.parking.table[s.program]);
}
function discountFor(p, s, pv){
  if(p === "serbor") return lookupRow(CONFIG.serbor.standard[s.program], s.term, CONFIG.serbor.pv, pv);
  if(p === "zorge") return lookupRow(CONFIG.zorge.lots[s.lot][s.program], s.term, CONFIG.zorge.pv, pv);
  if(pv === 1) return 0;
  return lookupRow(CONFIG.parking.table[s.program], s.term, CONFIG.parking.pv, pv);
}
function normalize(){
  var p = state.project, s = state[p], cfg = CONFIG[p], pr = cfg.programs[s.program];
  if(!pr){ s.program = Object.keys(cfg.programs)[0]; pr = cfg.programs[s.program]; }
  if(pr.fixedPv) s.pv = pr.fixedPv; else if(cfg.pv.indexOf(s.pv) < 0 || (p==="serbor" && s.pv===0.1)) s.pv = cfg.pv[Math.min(1,cfg.pv.length-1)];
  var t = termsFor(p, s);
  if(t.length && t.indexOf(s.term) < 0) s.term = t.reduce(function(a,b){ return Math.abs(b-s.term) < Math.abs(a-s.term) ? b : a; });
  if(!pr.fixedPv && !(p==="parking" && s.pv===1) && discountFor(p,s,s.pv) === null){
    var ok = cfg.pv.filter(function(v){ return v!==1 && discountFor(p,s,v) !== null; });
    if(ok.length) s.pv = ok[ok.length-1];
  }
}

/* ---------- форма ---------- */
function radios(name, items, current, stack){
  var gridCols = stack === "grid" ? (items.length <= 6 ? items.length : Math.ceil(items.length/2)) : 0;
  return '<div class="seg'+(stack===true?" stack":"")+(gridCols?' grid" style="--cols:'+gridCols:'')+'" role="radiogroup">' + items.map(function(it,i){
    var id = name+"-"+i;
    return '<input type="radio" id="'+id+'" name="'+name+'" value="'+it.value+'" '+(String(it.value)===String(current)?"checked":"")+' '+(it.disabled?"disabled":"")+'><label for="'+id+'">'+esc(it.label)+'</label>';
  }).join("") + '</div>';
}
function moneyField(id, label, value, range, hint){
  var h = '<div class="field" id="f-'+id+'"><label class="lbl" for="'+id+'">'+label+(hint?' <button type="button" class="hint-btn" aria-expanded="false" aria-controls="h-'+id+'" aria-label="Пояснение">?</button>':'')+'</label>';
  if(hint) h += '<p class="hint" id="h-'+id+'" hidden>'+hint+'</p>';
  h += '<div class="money"><input id="'+id+'" inputmode="numeric" autocomplete="off" value="'+(isFinite(value)?nf0.format(value):"")+'" aria-describedby="e-'+id+'"><span>₽</span></div>';
  if(range){
    var mn=range[0], mx=range[1], step = mx>=100000000?500000:mx>=20000000?100000:10000;
    h += '<input type="range" id="'+id+'-r" min="'+mn+'" max="'+mx+'" step="'+step+'" value="'+Math.min(Math.max(value||mn,mn),mx)+'" aria-label="'+label+', ползунок"><div class="range-ends"><span>'+nf0.format(mn)+' ₽</span><span>'+nf0.format(mx)+' ₽</span></div>';
  }
  return h + '<p class="msg" id="e-'+id+'" hidden></p></div>';
}
function renderProjects(){
  $("#projects").innerHTML = PROJECTS.map(function(k,i){
    return '<input type="radio" id="pr-'+i+'" name="project" value="'+k+'" '+(k===state.project?"checked":"")+'><label for="pr-'+i+'">'+esc(CONFIG[k].name)+'</label>';
  }).join("");
}

/* ---------- проверка ввода ---------- */
function validate(){
  var p = state.project, s = state[p], errs = {};
  if(!(s.price > 0)) errs.price = "Введите цену больше нуля.";
  if(p !== "parking"){
    if(!(s.dvou >= 0)) errs.dvou = "Введите сумму ДВОУ (можно 0).";
    else if(s.price > 0 && s.dvou >= s.price*0.5) errs.dvou = "ДВОУ больше половины цены — проверьте сумму.";
  } else if(!(s.dop >= 0) || s.dop >= 1) errs.dop = "Скидка должна быть от 0 до 99%.";
  ["price","dvou","dop"].forEach(function(k){
    var f = document.getElementById("f-"+k), e = document.getElementById("e-"+k), inp = document.getElementById(k);
    if(!f) return;
    f.classList.toggle("err", !!errs[k]); e.hidden = !errs[k]; e.textContent = errs[k] || "";
    if(inp) inp.setAttribute("aria-invalid", errs[k] ? "true" : "false");
  });
  return errs;
}

/* ---------- расчёт текущего экрана ---------- */
function programTitle(p, s){ return CONFIG[p].programs[s.program].label; }
function compute(){
  var p = state.project, s = state[p];
  if(Object.keys(validate()).length) return {error:"Исправьте поля, отмеченные красным, — и расчёт появится здесь."};
  if(p === "serbor"){
    var d = serborDiscounts(s.program, s.term, s.pv);
    if(d.std === null) return {error:"Для этого сочетания программы, срока и взноса скидки нет. Выберите другие условия."};
    var base = {price:s.price, dvou:s.dvou, pv:s.pv, term:s.term, program:s.program};
    return { kind:"serbor", d:d,
      a: Object.assign(calcFlat(Object.assign({discount:d.std}, base)), {title:CONFIG.serbor.standard.title}),
      b: Object.assign(calcFlat(Object.assign({discount:d.red}, base)), {title:CONFIG.serbor.reduced.title}) };
  }
  if(p === "zorge"){
    var disc = discountFor(p, s, s.pv);
    if(disc === null) return {error:"Для этого сочетания условий скидки нет."};
    return { kind:"zorge", a: Object.assign(calcFlat({price:s.price, dvou:s.dvou, pv:s.pv, term:s.term, program:s.program, discount:disc}), {title:CONFIG.zorge.lots[s.lot].label}) };
  }
  var full = s.pv === 1, corr = full ? 0 : discountFor(p, s, s.pv);
  if(corr === null) return {error:"Для этого сочетания условий программы нет."};
  return { kind:"parking", a: Object.assign(calcParking({price:s.price, dop:s.dop, pv:s.pv, term:s.term, program:s.program, corr:corr}), {title:"Машино-место"}) };
}

function tween(prev){
  if(reduceMotion) return;
  Array.prototype.forEach.call(document.querySelectorAll("#results .tw"), function(el,i){

/* ---------- копирование графика (вставляется в Excel столбцами) ---------- */
function tsvNum(x){ return String(xround(x,2)).replace(".", ","); }
function buildTsv(){
  var items = exportItems(), s = state[state.project], program = (items[0]&&items[0].full) ? "full" : s.program, lines = [];
  lines.push("График погашения рассрочки"); lines.push("Программа\t" + programName()); lines.push("Дата расчёта\t" + today());
  items.forEach(function(r){
    lines.push("");
    if(items.length > 1 || state.project === "serbor") lines.push(r.title);
    kvRows(r).forEach(function(kv){ lines.push(kv[0] + "\t" + kv[1].replace(/ /g," ")); });
    lines.push(""); lines.push("Номер платежа\tПлатеж\tСумма выплат\tОстаток");
    r.schedule.forEach(function(x){ lines.push(whenCell(x.n, program) + "\t" + tsvNum(x.pay) + "\t" + tsvNum(x.paid) + "\t" + tsvNum(x.rest)); });
  });
  return lines.join("\n");
}

async function savePdf(btn){
  var items = exportItems(); if(!items.length) return;
  if(!window.html2canvas || !window.jspdf){ toast("Не удалось загрузить модуль PDF. Проверьте интернет и обновите страницу.", 5000); return; }
  btn.disabled = true; var label = btn.innerHTML; btn.innerHTML = ICON_PDF + "Готовлю PDF…";
  var sheet = document.createElement("div");
  sheet.className = "sheet" + (items.length > 1 ? " wide" : "");
  sheet.innerHTML = sheetHtml(items);
  document.body.appendChild(sheet);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    var imgs = sheet.querySelectorAll("img"); await Promise.all(Array.prototype.map.call(imgs, function(im){ return im.complete ? 0 : new Promise(function(r){ im.onload = im.onerror = r; }); }));
    var scale = 2;
    var canvas = await window.html2canvas(sheet, {scale:scale, backgroundColor:"#ffffff", logging:false, windowWidth: sheet.offsetWidth + 40});
    var wide = items.length > 1;
    var pdf = new window.jspdf.jsPDF({orientation: wide ? "landscape" : "portrait", unit:"mm", format:"a4", compress:true});
    var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    var pxPerMm = canvas.width / pw, pageH = Math.floor(ph * pxPerMm);
    // точки разрыва страниц — по нижним границам строк, чтобы не резать строку
    var top0 = sheet.getBoundingClientRect().top;
    var cuts = Array.prototype.map.call(sheet.querySelectorAll("tr, .s-foot, h3"), function(el){ return Math.round((el.getBoundingClientRect().bottom - top0) * scale); }).sort(function(a,b){return a-b;});
    var contentEnd = Math.min(canvas.height, (cuts.length ? cuts[cuts.length-1] : canvas.height) + 2);
    var y = 0, page = 0;
    while(y < contentEnd - 4){
      var end = Math.min(y + pageH, canvas.height);
      if(end >= contentEnd) end = canvas.height;
      if(end < canvas.height){ var fit = cuts.filter(function(c){ return c > y + 40 && c <= end; }); if(fit.length) end = fit[fit.length-1] + 2; }
      var part = document.createElement("canvas"); part.width = canvas.width; part.height = end - y;
      var ctx = part.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,part.width,part.height); ctx.drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
      if(page) pdf.addPage();
      pdf.addImage(part.toDataURL("image/jpeg", 0.93), "JPEG", 0, 0, pw, (end - y) / pxPerMm);
      y = end; page++;
    }
    var fname = pdfName(items);
    var dl = await cap("downloads");
    if(dl){
      try{ await dl.save({filename: fname, data: pdf.output("blob")}); toast("PDF сохранён"); }
      catch(e){ if(!(e && (e.code === "cancelled" || e.code === "declined"))) toast("Не удалось сохранить файл: " + ((e && e.message) || "ошибка"), 5000); }
    } else {
      pdf.save(fname); toast("PDF сохранён в загрузки");
    }
  } catch(e){ toast("Не получилось собрать PDF: " + (e && e.message || e), 6000); }
  finally { sheet.remove(); btn.disabled = false; btn.innerHTML = label; }
}

  e.preventDefault();
  var v = document.getElementById("pw").value;
  if(!(window.crypto && crypto.subtle)){ dlgState.pwError = "Проверка пароля работает только на странице с адресом https://."; renderDialog(); return; }
  var ok = false; try{ ok = (await sha256(v)) === CONFIG.admin.passwordSha256; }catch(err){ ok = false; }
  if(ok){ dlgState.askPw = false; dlgState.pwError = ""; dlgState.edit = true; dlgState.draft = JSON.parse(JSON.stringify(CONFIG)); renderDialog(); }
  else { dlgState.pwError = "Неверный пароль."; renderDialog(); }
});
$("#dlg").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.id === "dlg-close") closePrices();
  else if(b.id === "edit-start"){ dlgState.askPw = true; dlgState.pwError = ""; renderDialog(); }
  else if(b.id === "pw-cancel"){ dlgState.askPw = false; renderDialog(); }
  else if(b.id === "edit-cancel"){ dlgState.edit = false; dlgState.draft = null; renderDialog(); }
  else if(b.id === "edit-save") saveDraft();
  else if(b.dataset.rm){ if(!readDraftInputs()) return; var t = getPath(dlgState.draft, b.dataset.rm); delete t[b.dataset.term]; renderDialog(); }
  else if(b.dataset.add){
    if(!readDraftInputs()) return;
    var inp = document.getElementById("add-" + b.dataset.add.replace(/\./g,"-")), n = Number(inp.value);
    if(!(n >= 1 && n <= 60 && Math.round(n) === n)){ inp.classList.add("bad"); inp.focus(); return; }
    var tb = getPath(dlgState.draft, b.dataset.add), len = (b.dataset.add.indexOf("parking")===0 ? dlgState.draft.parking.pv.filter(function(v){return v!==1;}) : getPath(dlgState.draft, b.dataset.add.split(".")[0]).pv).length;
    if(!tb[String(n)]){ tb[String(n)] = []; for(var i=0;i<len;i++) tb[String(n)].push(null); }
    renderDialog();
  }
});

// Кнопка «Редактировать»: в Claude — только тем, кто может править страницу; на сайте — по адресу …#admin
cap("user").then(function(u){ return u ? u.canEdit() : false; }).catch(function(){ return false; }).then(function(ok){
  dlgState.canAdmin = !!ok || location.hash === "#admin";
  if($("#prices").open && !dlgState.edit && !dlgState.askPw) renderDialog();
});
if(location.hash === "#admin") dlgState.canAdmin = true;
try{ if(sessionStorage.getItem("rs-saved")){ sessionStorage.removeItem("rs-saved"); setTimeout(function(){ toast("Условия сохранены"); }, 400); } }catch(e){}

renderLogo(); renderProjects(); renderForm(); renderResults();
})();
</script>
