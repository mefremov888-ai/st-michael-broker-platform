upstream api {
    server api:4000;
}

upstream web {
    server web:3000;
}

# Per-source protection for the public readiness route. The API itself keeps a
# 5-second single-flight cache, while this nginx zone prevents one client from
# exhausting every monitor/deploy request with a process-global counter.
limit_req_zone $binary_remote_addr zone=health_readiness:10m rate=30r/m;

# HTTP-01 for Let's Encrypt must be served on :80 without a 301 to HTTPS.
# LE follows that redirect, and an expired certificate (NET::ERR_CERT_DATE_INVALID)
# then blocks issuance. Keep this location even after the cert is valid so
# `certbot renew` can keep working without stopping nginx.
server {
    listen 80;
    server_name broker.stmichael.ru;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /usr/share/nginx/acme-webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name broker.stmichael.ru;

    ssl_certificate /etc/letsencrypt/live/broker.stmichael.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/broker.stmichael.ru/privkey.pem;

    client_max_body_size 200M;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /usr/share/nginx/acme-webroot;
    }

    # Uploaded files (served from shared docker volume)
    location /files/ {
        alias /usr/share/nginx/files/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 2026-09-30: HTML-документы из загрузок (калькулятор рассрочки) открываются
    # в браузере, а не скачиваются. Они живут на том же origin, что и кабинет,
    # поэтому режем им возможности: скрипты только свои и cdnjs, стили/шрифты —
    # Google Fonts, никаких сетевых запросов (connect-src 'none'), форм и
    # объектов. Полный sandbox (opaque origin) не подходит — html2canvas в нём
    # не может открыть свой iframe и «Сохранить PDF» падает (проверено 30.09).
    # Кэш короткий: файл можно перезалить под тем же именем.
    location ~* ^/files/.+\.html?$ {
        root /usr/share/nginx;
        charset utf-8;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'" always;
        try_files $uri =404;
    }

    # API and Swagger
    location = /api/health/ready {
        limit_req zone=health_readiness burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
