name: Inspect Telegram reachability (read-only)

# 2026-09-17: с прод-сервера перестали уходить сообщения в Телеграм.
# Проверяем, каким путём сервер достаёт до api.telegram.org (IPv4 / IPv6 /
# системный выбор) и что Телеграм отвечает на реальную отправку в ops-чаты.
# В выводе нет ни токена, ни полного адреса чата — только последние четыре
# цифры и ответ Телеграма.

on:
  workflow_dispatch: {}

concurrency:
  group: inspect-telegram-reachability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Probe api.telegram.org from production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and probe
        uses: appleboy/ssh-action@v1.0.3
        env:
          BOT: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          GH_CHAT: ${{ secrets.OPS_ALERT_CHAT_ID }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: false
          command_timeout: 8m
          envs: BOT,GH_CHAT
          script: |
            echo "=== DNS ==="
            getent ahostsv4 api.telegram.org | head -1 | awk '{print "IPv4:", $1}'
            getent ahostsv6 api.telegram.org | head -1 | awk '{print "IPv6:", $1}'
            probe() {
              label="$1"; shift
              code=$(curl -sS -o /dev/null -w '%{http_code} за %{time_total}s' "$@" \
                "https://api.telegram.org/bot${BOT}/getMe" 2>&1 | tail -1)
              echo "$label -> $code"
            }
            echo "=== Попытки соединения ==="
            probe "IPv4          " -4 --connect-timeout 10 --max-time 25
            probe "IPv6          " -6 --connect-timeout 10 --max-time 25
            probe "системный путь" --connect-timeout 10 --max-time 25
            echo "=== Пробная отправка: ответ Телеграма дословно ==="
            send() {
              chat="$1"
              body=$(curl -sS --connect-timeout 10 --max-time 25 -X POST \
                "https://api.telegram.org/bot${BOT}/sendMessage" \
                --data-urlencode chat_id="$chat" \
                --data-urlencode text="Проверка связи от кабинета брокера" 2>&1 | head -c 200)
              echo "chat ...$(printf '%s' "$chat" | tail -c 4): $body"
            }
            ENV_FILE="${{ secrets.DEPLOY_PATH }}/.env"
            ids=$(grep -hE 'OPS_ALERT_CHAT_IDS?=' "$ENV_FILE" 2>/dev/null | sed -e 's/^[^=]*=//' | tr -d '"'"'"' \t\r' | tr ',;' ' ')
            for chat in $ids $GH_CHAT; do
              case "$chat" in
                ''|*[!0-9-]*) continue ;;
              esac
              send "$chat"
            done
            echo "=== Готово ==="
