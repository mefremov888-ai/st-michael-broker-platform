name: Apply old cabinet brokers

# 2026-09-14 (решение владельца «да по всем»): заводим карточки брокеров
# старого кабинета, которых нет в нашей базе. Без них 473 заявки из
# выгрузки не доезжают — импорт пропускает строки, где брокер не найден
# по телефону. Источник — справочник brokers.xlsx от 29.08.2026
# (2 309 человек), данные зашиты в скрипт.
#
# Карточки создаются PENDING, без пароля, baseSource = old_cabinet.
# Агентства НЕ сводятся и не создаются: владелец решил, что разные
# написания — это разные юрлица; исходное название кладётся в заметку.
#
# Боевой режим требует dry_run=false И confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только отчёт, ничего не пишется)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись в прод-БД (нужно вместе с dry_run=false)'
        required: true
        default: false
        type: boolean

concurrency:
  group: apply-old-cabinet-brokers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Create old cabinet broker cards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 40m
          envs: DRY_RUN_INPUT,CONFIRM_APPLY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show origin/master:scripts/apply-old-cabinet-brokers.js > /tmp/apply-old-cabinet-brokers.js
            docker cp /tmp/apply-old-cabinet-brokers.js st-michael-api:/app/scripts/apply-old-cabinet-brokers.js
            MODE=1
            CONFIRM=0
            if [ "$DRY_RUN_INPUT" = "false" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; CONFIRM=1; fi
            if [ "$MODE" = "1" ]; then echo "=== DRY-RUN (без записи) ==="; else echo "=== APPLY (запись в БД) ==="; fi
            docker compose exec -T -e DRY_RUN=$MODE -e CONFIRM=$CONFIRM api node /app/scripts/apply-old-cabinet-brokers.js
            echo "=== Готово (DRY_RUN=$MODE) ==="
