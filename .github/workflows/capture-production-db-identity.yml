name: Capture production DB identity (read-only)

# Ручной запуск. Печатает ДВА несекретных значения, нужных для
# PRODUCTION_PG_SYSTEM_IDENTIFIER / PRODUCTION_MIN_BROKER_ROWS
# (см. packages/database/prisma/migrations/README.md, раздел
# "Automated deployment preflight"). Только SELECT-запросы через уже
# работающий postgres-контейнер — ничего не пишет, credentials нигде не
# печатает и не строит.

on:
  workflow_dispatch: {}

concurrency:
  group: capture-db-identity
  cancel-in-progress: false

jobs:
  capture:
    name: Read identity + row count on production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH and read
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 3m
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "database:"
            docker compose exec -T postgres psql -U postgres -d broker_platform -Atqc "SELECT current_database();"
            echo "system_identifier:"
            docker compose exec -T postgres psql -U postgres -d broker_platform -Atqc "SELECT system_identifier FROM pg_control_system();"
            echo "broker_rows:"
            docker compose exec -T postgres psql -U postgres -d broker_platform -Atqc "SELECT COUNT(*) FROM public.brokers;"
            echo "baseline_checksum_expected:"
            sha256sum packages/database/prisma/migrations/0_legacy_baseline/migration.sql | awk '{print $1}'
