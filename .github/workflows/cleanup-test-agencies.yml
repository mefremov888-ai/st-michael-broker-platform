name: Cleanup test agencies

# 2026-09-04: разовая чистка 12 ТЕСТОВЫХ агентств из БД кабинета
# (идентификация по ИНН, список зашит в scripts/cleanup-test-agencies.js).
# Скрипт печатает связи (broker_agencies, deals, clients, loyalty-*),
# ищет следы в amoCRM (только чтение) и с apply=true удаляет агентства:
# broker_agencies удаляются, nullable-ссылки занулятся, брокеры не трогаются.
# По умолчанию dry-run — ничего не меняет.
#
# Запуск: gh workflow run cleanup-test-agencies.yml [-f apply=true]

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Удалить из БД (false = dry-run, только отчёт)'
        required: true
        type: boolean
        default: false
      only_inns:
        description: 'Только эти ИНН через запятую (пусто = весь список)'
        required: false
        default: ''
        type: string
      only_names:
        description: 'Только эти названия через ; (мусорные агентства без ИНН)'
        required: false
        default: ''
        type: string

concurrency:
  group: cleanup-test-agencies
  cancel-in-progress: false

jobs:
  cleanup:
    name: Run cleanup on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH and run cleanup
        uses: appleboy/ssh-action@v1.0.3
        env:
          ONLY_INNS_INPUT: ${{ inputs.only_inns }}
          ONLY_NAMES_INPUT: ${{ inputs.only_names }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          envs: ONLY_INNS_INPUT,ONLY_NAMES_INPUT
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show origin/master:scripts/cleanup-test-agencies.js > /tmp/cleanup-test-agencies.js
            docker cp /tmp/cleanup-test-agencies.js st-michael-api:/app/scripts/cleanup-test-agencies.js
            ARGS=""
            if [ "${{ inputs.apply }}" = "true" ]; then ARGS="--apply"; fi
            docker compose exec -T -e ONLY_INNS="$ONLY_INNS_INPUT" -e ONLY_NAMES="$ONLY_NAMES_INPUT" api node /app/scripts/cleanup-test-agencies.js $ARGS
            echo "=== Готово ==="
