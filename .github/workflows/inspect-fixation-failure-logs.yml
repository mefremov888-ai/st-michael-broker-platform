name: Inspect fixation failure logs (one-off, read-only)

# Разовая диагностика 05.09.2026 (v2): в логах api замечены ошибки валидации
# Prisma с полями uniqueness*. Смотрим полный контекст этих ошибок с таймстампами,
# плюс все [fixClient] строки. Ничего не меняем.

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    name: SSH and grep fixation errors with context (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH and inspect logs
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 3m
          script: |
            set -eu
            echo "=== [fixClient] строки с таймстампами за 48 часов ==="
            docker logs -t st-michael-api --since 48h 2>&1 | grep -F "[fixClient]" | tail -30 || echo "(нет)"
            echo ""
            echo "=== PrismaClientValidationError: заголовки с таймстампами (какая операция) ==="
            docker logs -t st-michael-api --since 48h 2>&1 | grep -nE "PrismaClientValidationError|Invalid .* invocation|Unknown arg|Unknown argument|Argument .* is missing" | tail -30 || echo "(нет)"
            echo ""
            echo "=== Контекст ПОСЛЕДНЕЙ Prisma-ошибки: 35 строк до первого 'uniquenessReason' с конца ==="
            docker logs st-michael-api --since 48h 2>&1 | grep -B35 "uniquenessReason" | tail -60 || echo "(нет)"
            echo ""
            echo "=== 500/503 ошибки Nest с таймстампами за 24 часа (до 30) ==="
            docker logs -t st-michael-api --since 24h 2>&1 | grep -iE "ServiceUnavailable|Internal server error|ERROR \[" | tail -30 || echo "(нет)"
            echo ""
            echo "=== Готово (ничего не изменено) ==="
