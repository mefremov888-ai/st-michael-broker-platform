name: Inspect fixation failure logs (one-off, read-only)

# v4 (05.09.2026): пользователь сообщает о новых ошибках при фиксации.
# Смотрим за последние 8 часов: все [fixClient], все ops-алерты фиксаций
# (тот же текст, что бот шлёт в TG), ошибки /api/clients/fix и контексты.
# Ничего не меняем.

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    name: SSH and print recent fixation errors (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH and inspect logs
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 3m
          script: |
            set -eu
            echo "=== [fixClient] за 8 часов ==="
            docker logs -t st-michael-api --since 8h 2>&1 | grep -F "[fixClient]" | tail -40 || echo "(нет)"
            echo ""
            echo "=== Алерты фиксаций (interceptor/OpsAlert) за 8 часов ==="
            docker logs -t st-michael-api --since 8h 2>&1 | grep -iE "fixation-failure|OpsAlert|техническая ошибка|clients/fix" | tail -40 || echo "(нет)"
            echo ""
            echo "=== ERROR-строки Nest за 4 часа (до 40) ==="
            docker logs -t st-michael-api --since 4h 2>&1 | grep -E "ERROR" | tail -40 || echo "(нет)"
            echo ""
            echo "=== ConflictException/BadRequest/Unprocessable за 8 часов ==="
            docker logs -t st-michael-api --since 8h 2>&1 | grep -iE "Conflict|уникальн|неоднозначно|заблокирован" | tail -30 || echo "(нет)"
            echo ""
            echo "=== Готово (ничего не изменено) ==="
