name: Inspect fixation failure logs (one-off, read-only)

# v3 (05.09.2026): client.create починен; в логах остались Invalid
# prisma.$executeRaw() каждые 10 минут и Invalid prisma.broker.update().
# Смотрим полный контекст этих двух ошибок. Ничего не меняем.

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    name: SSH and print raw error contexts (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH and inspect logs
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 3m
          script: |
            set -eu
            echo "=== Контекст ПОСЛЕДНЕЙ ошибки \$executeRaw: 8 строк до + 40 после ==="
            docker logs st-michael-api --since 6h 2>&1 | grep -A40 -B8 'Invalid `prisma.\$executeRaw()` invocation' | tail -55 || echo "(нет)"
            echo ""
            echo "=== Контекст ПОСЛЕДНЕЙ ошибки broker.update: 8 строк до + 40 после ==="
            docker logs st-michael-api --since 6h 2>&1 | grep -A40 -B8 'Invalid `prisma.broker.update()` invocation' | tail -55 || echo "(нет)"
            echo ""
            echo "=== Успехи amo-синка за 3 часа (created/synced/totalClients) ==="
            docker logs st-michael-api --since 3h 2>&1 | grep -iE "amo.*sync.*(done|created|total)|totalClients|clients created" | tail -15 || echo "(нет)"
            echo ""
            echo "=== Готово (ничего не изменено) ==="
