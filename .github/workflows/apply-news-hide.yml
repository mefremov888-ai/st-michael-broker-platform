name: Apply news hide (скрыть 6 новостей сайта, 30.09)

# 2026-09-30, решение владельца: шесть новостей с сайта stmichael.ru снять с
# лендинга — статус согласования REJECTED («Отклонена»). Строки не удаляются:
# в админке «Лендинг → Новости» они видны в фильтре «Отклонённые», вернуть
# любую можно кнопкой «Опубликовать». Остальные 14 остаются APPROVED.
#
# Что происходит на сервере:
#   1. скрипт берётся из origin/master (git show) — то, что прошло ревью;
#   2. копируется в контейнер api (docker cp);
#   3. в dry-run скрипт ищет новости по нормализованному заголовку, печатает
#      найдено/не найдено и выполняет запись в транзакции с откатом;
#      в apply — записывает.
#
# Боевой режим требует mode=apply И confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run — только план и проверка в транзакции с откатом; apply — запись'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm_apply:
        description: 'Подтверждаю запись в прод-БД (нужно вместе с mode=apply)'
        required: true
        default: false
        type: boolean

concurrency:
  group: apply-news-hide
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Run on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          MODE_INPUT: ${{ inputs.mode }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          envs: MODE_INPUT,CONFIRM_APPLY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show origin/master:scripts/apply-news-hide-2026-09-30.js > /tmp/apply-news-hide-2026-09-30.js
            docker cp /tmp/apply-news-hide-2026-09-30.js st-michael-api:/app/scripts/apply-news-hide-2026-09-30.js
            MODE=1
            CONFIRM=0
            if [ "$MODE_INPUT" = "apply" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; CONFIRM=1; fi
            if [ "$MODE" = "1" ]; then echo "=== DRY-RUN (транзакция с откатом) ==="; else echo "=== APPLY (запись в БД) ==="; fi
            docker compose exec -T -e DRY_RUN=$MODE -e CONFIRM=$CONFIRM api node /app/scripts/apply-news-hide-2026-09-30.js
            if [ "$MODE" = "0" ]; then
              echo "=== Публичная выдача /api/public/cms/news (должно быть без скрытых) ==="
              docker compose exec -T api node -e "fetch('http://localhost:4000/api/public/cms/news').then(r=>r.json()).then(d=>{const a=Array.isArray(d)?d:[];console.log(a.length+' новост(ей)');a.forEach(x=>console.log(' - '+(x.publishedAt||'').slice(0,10)+' · '+(x.source||'')+' · '+x.title));}).catch(e=>console.log('не удалось опросить API: '+e.message))"
            fi
            echo "=== Готово (DRY_RUN=$MODE) ==="
