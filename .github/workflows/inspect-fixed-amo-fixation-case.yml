name: Inspect approved single amo fixation case (read-only)

# Fixed source-bound client/broker scope; no arbitrary operator identifiers,
# refresh, repair, retry, SMS/email or database/amoCRM mutation.
on:
  workflow_dispatch: {}
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact reviewed case inspector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Attest production and inspect only the approved case
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          PRODUCTION_PG_SYSTEM_IDENTIFIER: ${{ vars.PRODUCTION_PG_SYSTEM_IDENTIFIER }}
          PRODUCTION_MIN_BROKER_ROWS: ${{ vars.PRODUCTION_MIN_BROKER_ROWS }}
        run: |
          set -eEuo pipefail
          stage=local_validation
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "fixed_case_failed_stage=%s\nfixed_case_exit_code=%s\n" "$stage" "$rc" >&2; fi' EXIT
          set_stage() { stage=$1; printf 'fixed_case_stage=%s\n' "$stage"; }
          test "$EXPECTED_REPOSITORY" = sereganikitin/st-michael-broker-platform || exit 1
          test "$EXPECTED_REF" = refs/heads/master || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || exit 1
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 1
          [[ "$PRODUCTION_PG_SYSTEM_IDENTIFIER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$PRODUCTION_MIN_BROKER_ROWS" =~ ^[1-9][0-9]*$ ]] || exit 1
          for tool in curl gh jq node sha256sum timeout base64 ssh ssh-keyscan ssh-keygen; do command -v "$tool" >/dev/null || exit 1; done
          set_stage local_master_identity
          master_sha=$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/heads/master" --jq '.object.sha' 2>/dev/null) || exit 1
          test "$master_sha" = "$EXPECTED_SHA" || exit 1
          set_stage local_https_health
          deployed_sha=$(curl --fail --silent --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))') || exit 1
          set_stage local_source_ancestry
          compare_status=$(gh api "/repos/$EXPECTED_REPOSITORY/compare/$deployed_sha...$EXPECTED_SHA" --jq '.status' 2>/dev/null) || exit 1
          case "$compare_status" in ahead|identical) ;; *) exit 1;; esac
          unset master_sha compare_status GH_TOKEN
          inspector_path=scripts/inspect-fixed-amo-fixation-case.js
          dependency_path=scripts/inspect-amo-fixation-lead-reconciliation.js
          for path in "$inspector_path" "$dependency_path"; do test -f "$path" -a ! -L "$path" || exit 1; done
          inspector_sha=$(sha256sum -- "$inspector_path" | awk '{print $1}')
          dependency_sha=$(sha256sum -- "$dependency_path" | awk '{print $1}')
          [[ "$inspector_sha" =~ ^[0-9a-f]{64}$ && "$dependency_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          runner_temp=${RUNNER_TEMP:-/tmp}
          test -d "$runner_temp" -a ! -L "$runner_temp" || exit 1
          ssh_root=$(mktemp -d "$runner_temp/st-michael-fixed-case.XXXXXX")
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          bundle_path="$ssh_root/reviewed-case.js"
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "fixed_case_failed_stage=%s\nfixed_case_exit_code=%s\n" "$stage" "$rc" >&2; fi; rm -f -- "$known_hosts" "$private_key" "$bundle_path"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          set_stage local_hash_bound_bundle
          node - "$dependency_path" "$inspector_path" "$dependency_sha" "$inspector_sha" > "$bundle_path" <<'BUNDLE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const [dependencyPath, inspectorPath, dependencySha, inspectorSha] = process.argv.slice(2);
          function source(path, hash) {
            const bytes = fs.readFileSync(path);
            if (bytes.length > 262144 || createHash('sha256').update(bytes).digest('hex') !== hash) throw new Error('Source binding refused');
            // A shebang is legal only at the beginning of a JS program;
            // comment it after authenticating the original dependency bytes.
            return bytes.toString('utf8').replace(/^#!([^\r\n]*)/, '//#!$1');
          }
          const dependency = source(dependencyPath, dependencySha);
          const inspector = source(inspectorPath, inspectorSha);
          process.stdout.write(`"use strict";\nconst FIXED_CASE_DEPENDENCY_SOURCE_SHA256=${JSON.stringify(dependencySha)};\nconst FIXED_CASE_INSPECTOR_SOURCE_SHA256=${JSON.stringify(inspectorSha)};\nconst FIXED_CASE_RECONCILIATION_HELPERS=(()=>{const module={exports:{}};const exports=module.exports;\n${dependency}\nreturn module.exports;})();\n${inspector}\n`);
          BUNDLE
          bundle_sha=$(sha256sum -- "$bundle_path" | awk '{print $1}')
          [[ "$bundle_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          set_stage local_ssh_host_identity
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          unset SSH_PRIVATE_KEY
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          fingerprints=$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "$fingerprints" = "$EXPECTED_SSH_FINGERPRINT" || exit 1
          set_stage local_pinned_ssh
          {
            cat <<'REMOTE_PREFIX'
          set -eEuo pipefail
          stage=remote_validation
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "fixed_case_failed_stage=%s\nfixed_case_exit_code=%s\n" "$stage" "$rc" >&2; fi' EXIT
          set_stage() { stage=$1; printf 'fixed_case_stage=%s\n' "$stage"; }
          export LC_ALL=C GIT_OPTIONAL_LOCKS=0
          deploy_path=$1
          expected_deployed_sha=$2
          expected_system_identifier=$3
          minimum_broker_rows=$4
          expected_bundle_sha=$5
          expected_inspector_sha=$6
          expected_dependency_sha=$7
          for tool in awk base64 curl docker flock git jq readlink sha256sum stat timeout; do command -v "$tool" >/dev/null || exit 1; done
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) exit 1;; esac
          [[ "$expected_deployed_sha" =~ ^[0-9a-f]{40}$ && "$expected_system_identifier" =~ ^[0-9]+$ && "$minimum_broker_rows" =~ ^[1-9][0-9]*$ ]] || exit 1
          for hash in "$expected_bundle_sha" "$expected_inspector_sha" "$expected_dependency_sha"; do [[ "$hash" =~ ^[0-9a-f]{64}$ ]] || exit 1; done
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != / -a -d "$deploy_root" || exit 1
          set_stage remote_shared_lock
          lock_path=/tmp/st-michael-production-deploy.lock
          test -f "$lock_path" -a ! -L "$lock_path" || exit 1
          lock_identity=$(stat -Lc '%d:%i' -- "$lock_path")
          exec 9<"$lock_path"
          test "$(stat -Lc '%d:%i' -- /proc/$$/fd/9)" = "$lock_identity" || exit 1
          flock -s -n 9 || { echo 'production_lock_busy=true'; exit 1; }
          test "$(stat -Lc '%d:%i' -- "$lock_path")" = "$lock_identity" || exit 1
          set_stage remote_runtime_identity
          cd -- "$deploy_root"
          test "$(git rev-parse --show-toplevel)" = "$deploy_root" || exit 1
          test "$(git remote get-url origin)" = https://github.com/sereganikitin/st-michael-broker-platform.git || exit 1
          test "$(git symbolic-ref --short HEAD)" = master || exit 1
          test "$(git rev-parse HEAD)" = "$expected_deployed_sha" || exit 1
          test -z "${DOCKER_HOST:-}" -a -z "${DOCKER_CONTEXT:-}" || exit 1
          test "$(timeout 15 docker context show 2>/dev/null)" = default || exit 1
          test "$(timeout 15 docker context inspect default --format '{{.Endpoints.docker.Host}}' 2>/dev/null)" = unix:///var/run/docker.sock || exit 1
          test -S /var/run/docker.sock || exit 1
          security_options=$(timeout 15 docker info --format '{{json .SecurityOptions}}' 2>/dev/null)
          printf '%s' "$security_options" | jq -e 'type == "array" and all(.[]; type == "string" and (contains("rootless") | not))' >/dev/null || exit 1
          unset security_options
          project=$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' st-michael-postgres 2>/dev/null)
          [[ "$project" =~ ^[a-z0-9][a-z0-9_-]{0,62}$ ]] || exit 1
          for service in api postgres redis; do
            test "$(timeout 15 docker inspect --format '{{.State.Running}}' "st-michael-$service" 2>/dev/null)" = true || exit 1
            test "$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "st-michael-$service" 2>/dev/null)" = "$project" || exit 1
            test "$(timeout 15 docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "st-michael-$service" 2>/dev/null)" = "$service" || exit 1
          done
          assert_health() {
            local sha
            sha=$(curl --fail --silent --max-time 15 --proto '=https' --tlsv1.2 https://broker.stmichael.ru/api/health | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))') || return 1
            test "$sha" = "$expected_deployed_sha" || return 1
            test "$(timeout 15 docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"' 2>/dev/null)" = "$expected_deployed_sha" || return 1
          }
          set_stage remote_https_health
          assert_health || exit 1
          set_stage remote_readonly_database
          database_metrics=$(timeout 20 docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -AtF '|' -v ON_ERROR_STOP=1 -c "BEGIN READ ONLY; SET LOCAL statement_timeout='5s'; SET LOCAL lock_timeout='1s'; SELECT system_identifier, (SELECT count(*) FROM public.brokers) FROM pg_control_system(); ROLLBACK;" 2>/dev/null | awk -F'|' 'NF==2 && $1 ~ /^[0-9]+$/ {print}')
          [[ "$database_metrics" =~ ^[0-9]+\|[0-9]+$ ]] || exit 1
          IFS='|' read -r system_identifier broker_rows <<< "$database_metrics"
          test "$system_identifier" = "$expected_system_identifier" && test "$broker_rows" -ge "$minimum_broker_rows" || exit 1
          unset database_metrics system_identifier broker_rows
          set_stage remote_hash_bound_case_inspection
          base64 -d <<'FIXED_CASE_PAYLOAD' | timeout 7m docker exec -i \
            -e FIXED_CASE_INSPECTOR_SHA256="$expected_inspector_sha" \
            -e FIXED_CASE_DEPENDENCY_SHA256="$expected_dependency_sha" \
            -e FIXED_CASE_DEPLOYED_GIT_SHA="$expected_deployed_sha" \
            -e PRODUCTION_PG_SYSTEM_IDENTIFIER="$expected_system_identifier" \
            -e PRODUCTION_MIN_BROKER_ROWS="$minimum_broker_rows" \
            st-michael-api sh -c '
              set -eu
              expected_bundle_sha=$1
              test -d /app/scripts -a ! -L /app/scripts
              umask 077
              inspector=$(mktemp /app/scripts/.inspect-fixed-case.XXXXXX)
              cleanup() { rm -f -- "$inspector"; }
              trap cleanup EXIT HUP INT TERM
              cat > "$inspector"
              test "$(sha256sum "$inspector" | cut -d " " -f 1)" = "$expected_bundle_sha"
              node "$inspector"
            ' inspector "$expected_bundle_sha"
          REMOTE_PREFIX
            base64 -w 0 -- "$bundle_path"
            printf '\nFIXED_CASE_PAYLOAD\n'
            cat <<'REMOTE_SUFFIX'
          set_stage remote_post_inspection_health
          assert_health || exit 1
          test "$(stat -Lc '%d:%i' -- "$lock_path")" = "$lock_identity" || exit 1
          test "$(git rev-parse HEAD)" = "$expected_deployed_sha" || exit 1
          REMOTE_SUFFIX
          } | timeout --foreground 9m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$deployed_sha' '$PRODUCTION_PG_SYSTEM_IDENTIFIER' '$PRODUCTION_MIN_BROKER_ROWS' '$bundle_sha' '$inspector_sha' '$dependency_sha'"
