name: Rotate weak POSTGRES_PASSWORD (one-off)

# Ручной запуск. deploy-update.sh отказывается деплоить, пока
# POSTGRES_PASSWORD в серверном .env слабый/дефолтный (< 16 символов или
# буквально "postgres"). Генерирует новый случайный пароль ПРЯМО НА
# СЕРВЕРЕ, меняет его в самом Postgres и в .env, перезапускает только
# api-контейнер (postgres/redis/web/nginx не трогает), проверяет health.
#
# Пароль нигде не печатается и не покидает сервер — генерируется и
# используется в одном скрипте, не проходит через переменные GitHub
# Actions и не появляется в логах workflow.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: I understand this briefly restarts the api container
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate password and restart api only
    if: inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and rotate
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "=== 1/5: Генерируем новый пароль (не печатается) ==="
            NEW_PG_PASSWORD=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
            echo "Сгенерирован пароль длиной ${#NEW_PG_PASSWORD} символов."

            echo "=== 2/5: Меняем пароль в самом Postgres ==="
            docker compose exec -T postgres psql -U postgres -c "ALTER USER postgres WITH PASSWORD '${NEW_PG_PASSWORD}';" >/dev/null
            echo "Готово."

            echo "=== 3/5: Обновляем .env на сервере ==="
            ENV_FILE="$(pwd)/.env"
            grep -q '^POSTGRES_PASSWORD=' "$ENV_FILE" || { echo "✗ POSTGRES_PASSWORD не найден в .env — не буду добавлять новую строку вслепую."; exit 1; }
            ENV_TMP=$(mktemp "${ENV_FILE}.tmp.XXXXXX")
            cp "$ENV_FILE" "$ENV_TMP"
            chmod 600 "$ENV_TMP"
            sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${NEW_PG_PASSWORD}|" "$ENV_TMP"
            mv "$ENV_TMP" "$ENV_FILE"
            echo "Готово."
            unset NEW_PG_PASSWORD

            echo "=== 4/5: Перезапускаем только api (postgres/redis/web/nginx не трогаем) ==="
            docker compose up -d --no-deps --force-recreate api

            echo "Ждём готовности api..."
            i=0
            until docker exec st-michael-api wget -qO- http://localhost:4000/api/health 2>/dev/null | grep -q '"status":"ok"'; do
              i=$((i + 1))
              if [ "$i" -gt 60 ]; then
                echo "✗ api не поднялся за 60 секунд после перезапуска"
                exit 1
              fi
              sleep 1
            done
            echo "✓ api снова отвечает."

            echo "=== 5/5: Проверяем внешний сайт ==="
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://broker.stmichael.ru/api/health
            echo ""
            echo "=== Готово. Пароль обновлён, api перезапущен, сайт отвечает. ==="
