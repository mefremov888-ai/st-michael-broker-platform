name: Apply registry broker contacts (prepared list)

# 2026-09-08: проставить amo-контакт брокера строкам реестра по подготовленному
# списку (data/registry-broker-contacts.json); дальше — apply-registry-brokers-from-amo.

on:
  workflow_dispatch:
    inputs:
      data_branch:
        description: Ветка с data/registry-broker-contacts.json
        required: true
        default: data/registry-broker-contacts-20260908
        type: string
      dry_run:
        description: 'Dry-run (только отчёт)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись (нужно вместе с dry_run=false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: apply-registry-broker-contacts
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATA_BRANCH: ${{ inputs.data_branch }}
          DRY_INPUT: ${{ inputs.dry_run }}
          CONFIRM_INPUT: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 8m
          envs: DATA_BRANCH,DRY_INPUT,CONFIRM_INPUT
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin "$DATA_BRANCH"
            git fetch origin master
            git show "origin/$DATA_BRANCH:data/registry-broker-contacts.json" > /tmp/registry-broker-contacts.json
            git show origin/master:scripts/set-registry-broker-contacts.js > /tmp/set-registry-broker-contacts.js
            docker cp /tmp/registry-broker-contacts.json st-michael-api:/app/registry-broker-contacts.json
            docker cp /tmp/set-registry-broker-contacts.js st-michael-api:/app/scripts/set-registry-broker-contacts.js
            DRY=1
            if [ "$DRY_INPUT" = "false" ]; then
              if [ "$CONFIRM_INPUT" != "true" ]; then echo "dry_run=false требует confirm_apply=true"; exit 1; fi
              DRY=0
            fi
            docker compose exec -T -e DRY_RUN=$DRY api node /app/scripts/set-registry-broker-contacts.js /app/registry-broker-contacts.json
