name: Apply registry → broker links (amo lead contacts)

# 2026-09-07: привязка строк «Реестра сделок» без брокера к карточкам брокеров
# через контакты лида amoCRM (ровно один брокер-контакт → brokerId). Только
# пустые brokerId. По умолчанию dry-run (отчёт), запись — dry_run=false +
# confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только отчёт, ничего не пишется)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись brokerId в прод-БД (нужно вместе с dry_run=false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  link:
    name: Link on production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_INPUT: ${{ inputs.dry_run }}
          CONFIRM_INPUT: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 22m
          envs: DRY_INPUT,CONFIRM_INPUT
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            git show origin/master:scripts/link-registry-deals-to-brokers.js > /tmp/link-registry-deals-to-brokers.js
            docker cp /tmp/link-registry-deals-to-brokers.js st-michael-api:/app/scripts/link-registry-deals-to-brokers.js
            DRY=1
            if [ "$DRY_INPUT" = "false" ]; then
              if [ "$CONFIRM_INPUT" != "true" ]; then echo "dry_run=false требует confirm_apply=true"; exit 1; fi
              DRY=0
            fi
            docker compose exec -T -e DRY_RUN=$DRY api node /app/scripts/link-registry-deals-to-brokers.js
