name: Reclaim production build cache (no restart)

# One-purpose release gate. It removes only Docker builder cache, which is
# reproducible from source. It does not restart services or prune containers,
# tagged images, volumes, networks, database data, uploads, logs or backups.
on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: Confirm Docker builder cache prune only
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reclaim:
    name: Prune only reproducible production build cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Verify host and prune builder cache without restart
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_CLEANUP_SHA: ${{ github.sha }}
          CONFIRM_CLEANUP: ${{ inputs.confirm_cleanup }}
          CANONICAL_REPOSITORY: sereganikitin/st-michael-broker-platform
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          PRODUCTION_PG_SYSTEM_IDENTIFIER: ${{ vars.PRODUCTION_PG_SYSTEM_IDENTIFIER }}
          PRODUCTION_MIN_BROKER_ROWS: ${{ vars.PRODUCTION_MIN_BROKER_ROWS }}
        run: |
          set -euo pipefail
          test "$CONFIRM_CLEANUP" = "true" || { echo "Explicit build-cache cleanup confirmation is required"; exit 1; }
          test "$EXPECTED_REPOSITORY" = "$CANONICAL_REPOSITORY" || { echo "Cleanup is restricted to the canonical repository"; exit 1; }
          test "$EXPECTED_REF" = "refs/heads/master" || { echo "Cleanup is restricted to master"; exit 1; }
          [[ "$EXPECTED_CLEANUP_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Cleanup SHA is invalid"; exit 1; }
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || { echo "Production SSH configuration is incomplete"; exit 1; }
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) echo "Invalid SSH host"; exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || { echo "Invalid SSH user"; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || { echo "Invalid SSH port"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "Production SSH fingerprint variable is missing or invalid"; exit 1; }
          [[ "$PRODUCTION_PG_SYSTEM_IDENTIFIER" =~ ^[0-9]+$ ]] || { echo "Production database identity variable is missing or invalid"; exit 1; }
          [[ "$PRODUCTION_MIN_BROKER_ROWS" =~ ^[1-9][0-9]*$ ]] || { echo "Production broker-row floor is missing or invalid"; exit 1; }

          ssh_root=$(mktemp -d)
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || { echo "Expected exactly one production ED25519 fingerprint"; exit 1; }
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || { echo "Production SSH host fingerprint mismatch"; exit 1; }

          ssh -i "$private_key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- '$DEPLOY_PATH' '$PRODUCTION_PG_SYSTEM_IDENTIFIER' '$PRODUCTION_MIN_BROKER_ROWS' '$EXPECTED_CLEANUP_SHA'" <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C
          MIN_AVAILABLE_BYTES=8589934592
          BACKUP_SIZE_OVERHEAD_BYTES=67108864
          CANONICAL_REPOSITORY_URL=https://github.com/sereganikitin/st-michael-broker-platform.git
          BACKUP_PARENT=/var/backups/stmichael
          BACKUP_DIR=$BACKUP_PARENT/loyalty-predeploy
          deploy_path=$1
          expected_system_identifier=$2
          minimum_broker_rows=$3
          expected_cleanup_sha=$4

          for required_tool in awk df docker flock git readlink sha256sum sort; do
            command -v "$required_tool" >/dev/null || { echo "Required cleanup tool is missing"; exit 1; }
          done
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$deploy_path/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          [[ "$expected_system_identifier" =~ ^[0-9]+$ ]] || { echo "Invalid database identity"; exit 1; }
          [[ "$minimum_broker_rows" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid broker-row floor"; exit 1; }
          [[ "$expected_cleanup_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid cleanup SHA"; exit 1; }
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != "/" -a -d "$deploy_root" || { echo "Resolved deploy path must be an existing absolute non-root directory"; exit 1; }
          test ! -L "$BACKUP_PARENT" || { echo "Backup parent must not be a symlink"; exit 1; }
          backup_parent=$(readlink -f -- "$BACKUP_PARENT")
          test "$backup_parent" = "$BACKUP_PARENT" -a -d "$backup_parent" || { echo "Backup parent must be an existing canonical directory"; exit 1; }
          test ! -L "$BACKUP_DIR" || { echo "Backup directory must not be a symlink"; exit 1; }
          if [ -e "$BACKUP_DIR" ]; then
            backup_dir=$(readlink -f -- "$BACKUP_DIR")
            test "$backup_dir" = "$BACKUP_DIR" -a -d "$backup_dir" || { echo "Backup directory must be canonical when it exists"; exit 1; }
            backup_storage_path=$backup_dir
          else
            backup_storage_path=$backup_parent
          fi

          exec 9>/tmp/st-michael-production-deploy.lock
          flock -n 9 || { echo "Another production deploy/migration process holds the server lock"; exit 1; }
          export GIT_TERMINAL_PROMPT=0
          export GIT_OPTIONAL_LOCKS=0

          available_bytes() {
            df -P -B1 -- "$1" | awk 'NR == 2 { print $4 }'
          }
          require_uint() {
            [[ "$1" =~ ^[0-9]+$ ]] || { echo "Metric is not an unsigned integer"; exit 1; }
          }
          inventory_hash() {
            sha256sum | awk '{print $1}'
          }
          canonical_master_sha() {
            git ls-remote --exit-code "$CANONICAL_REPOSITORY_URL" refs/heads/master \
              | awk 'NR == 1 { print $1 }'
          }
          container_inventory() {
            while IFS= read -r container_id; do
              test -n "$container_id" || continue
              docker inspect --format '{{.Id}}|{{.Image}}|{{.Name}}|{{.State.Status}}|{{.State.Pid}}|{{.State.StartedAt}}|{{.RestartCount}}|{{json .Mounts}}' "$container_id"
            done < <(docker container ls -aq --no-trunc | sort)
          }
          running_container_inventory() {
            docker container ls -q --no-trunc | sort
          }
          tagged_image_inventory() {
            docker image ls --digests --no-trunc --format '{{.Repository}}|{{.Tag}}|{{.ID}}|{{.Digest}}' \
              | awk -F'|' '$1 != "<none>" && $2 != "<none>"' \
              | sort
          }
          volume_inventory() {
            while IFS= read -r volume_name; do
              test -n "$volume_name" || continue
              docker volume inspect --format '{{.Name}}|{{.Driver}}|{{.Mountpoint}}|{{.Scope}}|{{json .Labels}}|{{json .Options}}' "$volume_name"
            done < <(docker volume ls -q | sort)
          }
          network_inventory() {
            while IFS= read -r network_id; do
              test -n "$network_id" || continue
              docker network inspect --format '{{.Id}}|{{.Name}}|{{.Driver}}|{{.Scope}}|{{.Internal}}|{{.Attachable}}|{{json .Options}}|{{json .Labels}}' "$network_id"
            done < <(docker network ls -q --no-trunc | sort)
          }
          assert_database() {
            test "$(docker inspect --format '{{.State.Running}}' st-michael-postgres 2>/dev/null)" = "true" || { echo "Production PostgreSQL container is not running"; exit 1; }
            docker exec st-michael-postgres pg_isready -U postgres -d broker_platform >/dev/null
            actual_database=$(docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atqc "SELECT current_database()")
            actual_system_identifier=$(docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atqc "SELECT system_identifier FROM pg_control_system()")
            broker_rows=$(docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atqc "SELECT COUNT(*) FROM public.brokers")
            database_size_bytes=$(docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atqc "SELECT pg_database_size(current_database())")
            test "$actual_database" = "broker_platform" || { echo "Production database name mismatch"; exit 1; }
            test "$actual_system_identifier" = "$expected_system_identifier" || { echo "Production database identity mismatch"; exit 1; }
            [[ "$broker_rows" =~ ^[0-9]+$ ]] && [ "$broker_rows" -ge "$minimum_broker_rows" ] || { echo "Production broker-row invariant failed"; exit 1; }
            [[ "$database_size_bytes" =~ ^[1-9][0-9]{0,17}$ ]] || { echo "Production database size is invalid"; exit 1; }
          }

          test -z "${DOCKER_HOST:-}" || { echo "DOCKER_HOST must be unset for local cleanup"; exit 1; }
          test -z "${DOCKER_CONTEXT:-}" || { echo "DOCKER_CONTEXT must be unset for local cleanup"; exit 1; }
          test "$(docker context show)" = "default" || { echo "Docker default context is not active"; exit 1; }
          docker_endpoint=$(docker context inspect default --format '{{.Endpoints.docker.Host}}')
          case "$docker_endpoint" in unix:///*) ;; *) echo "Docker endpoint is not a local Unix socket"; exit 1;; esac
          docker_root_reported=$(docker info --format '{{.DockerRootDir}}')
          [[ "$docker_root_reported" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DockerRootDir is not a safe absolute path"; exit 1; }
          case "$docker_root_reported/" in *"/../"*|*"/./"*|*"//"*) echo "DockerRootDir contains an unsafe segment"; exit 1;; esac
          docker_root=$(readlink -f -- "$docker_root_reported")
          test -n "$docker_root" -a "$docker_root" != "/" -a -d "$docker_root" || { echo "Resolved DockerRootDir must be an existing absolute non-root directory"; exit 1; }

          canonical_sha_before=$(canonical_master_sha)
          test "$canonical_sha_before" = "$expected_cleanup_sha" || { echo "Canonical master changed or cleanup was not dispatched for current master"; exit 1; }
          assert_database
          required_backup_bytes=$((MIN_AVAILABLE_BYTES + database_size_bytes + BACKUP_SIZE_OVERHEAD_BYTES))
          require_uint "$required_backup_bytes"
          containers_before=$(container_inventory | inventory_hash)
          running_before=$(running_container_inventory | inventory_hash)
          tagged_images_before=$(tagged_image_inventory | inventory_hash)
          volumes_before=$(volume_inventory | inventory_hash)
          networks_before=$(network_inventory | inventory_hash)
          deploy_head_before=$(git -C "$deploy_root" rev-parse HEAD)
          deploy_status_before=$(git -C "$deploy_root" status --porcelain=v1 --untracked-files=all | inventory_hash)
          root_before=$(available_bytes /)
          deploy_before=$(available_bytes "$deploy_root")
          release_context_before=$(available_bytes /tmp)
          docker_before=$(available_bytes "$docker_root")
          backup_before=$(available_bytes "$backup_storage_path")
          for metric in "$root_before" "$deploy_before" "$release_context_before" "$docker_before" "$backup_before"; do require_uint "$metric"; done

          printf 'root_available_bytes_before=%s\n' "$root_before"
          printf 'required_backup_available_bytes=%s\n' "$required_backup_bytes"
          printf 'container_inventory_sha256_before=%s\n' "$containers_before"
          printf 'running_container_inventory_sha256_before=%s\n' "$running_before"
          printf 'tagged_image_inventory_sha256_before=%s\n' "$tagged_images_before"
          printf 'volume_inventory_sha256_before=%s\n' "$volumes_before"
          printf 'network_inventory_sha256_before=%s\n' "$networks_before"
          printf 'deploy_status_sha256_before=%s\n' "$deploy_status_before"
          docker system df

          if [ "$root_before" -ge "$required_backup_bytes" ] \
            && [ "$deploy_before" -ge "$required_backup_bytes" ] \
            && [ "$release_context_before" -ge "$required_backup_bytes" ] \
            && [ "$docker_before" -ge "$required_backup_bytes" ] \
            && [ "$backup_before" -ge "$required_backup_bytes" ]; then
            cleanup_performed=false
            cleanup_reason=all_release_filesystems_already_sufficient
          else
            canonical_sha_at_prune=$(canonical_master_sha)
            test "$canonical_sha_at_prune" = "$expected_cleanup_sha" || { echo "Canonical master changed before builder prune"; exit 1; }
            docker builder prune --all --force
            cleanup_performed=true
            cleanup_reason=backup_reserve_below_threshold
          fi

          assert_database
          required_backup_bytes_after=$((MIN_AVAILABLE_BYTES + database_size_bytes + BACKUP_SIZE_OVERHEAD_BYTES))
          containers_after=$(container_inventory | inventory_hash)
          running_after=$(running_container_inventory | inventory_hash)
          tagged_images_after=$(tagged_image_inventory | inventory_hash)
          volumes_after=$(volume_inventory | inventory_hash)
          networks_after=$(network_inventory | inventory_hash)
          deploy_head_after=$(git -C "$deploy_root" rev-parse HEAD)
          deploy_status_after=$(git -C "$deploy_root" status --porcelain=v1 --untracked-files=all | inventory_hash)
          root_after=$(available_bytes /)
          deploy_after=$(available_bytes "$deploy_root")
          release_context_after=$(available_bytes /tmp)
          docker_after=$(available_bytes "$docker_root")
          backup_after=$(available_bytes "$backup_storage_path")
          for metric in "$required_backup_bytes_after" "$root_after" "$deploy_after" "$release_context_after" "$docker_after" "$backup_after"; do require_uint "$metric"; done

          test "$containers_after" = "$containers_before" || { echo "Container inventory changed during cache cleanup"; exit 1; }
          test "$running_after" = "$running_before" || { echo "Running container inventory changed during cache cleanup"; exit 1; }
          test "$tagged_images_after" = "$tagged_images_before" || { echo "Tagged image inventory changed during cache cleanup"; exit 1; }
          test "$volumes_after" = "$volumes_before" || { echo "Volume inventory changed during cache cleanup"; exit 1; }
          test "$networks_after" = "$networks_before" || { echo "Network inventory changed during cache cleanup"; exit 1; }
          test "$deploy_head_after" = "$deploy_head_before" || { echo "Deploy worktree HEAD changed during cache cleanup"; exit 1; }
          test "$deploy_status_after" = "$deploy_status_before" || { echo "Deploy worktree status changed during cache cleanup"; exit 1; }

          printf 'cleanup_performed=%s\n' "$cleanup_performed"
          printf 'cleanup_reason=%s\n' "$cleanup_reason"
          printf 'root_available_bytes_after=%s\n' "$root_after"
          printf 'required_backup_available_bytes_after=%s\n' "$required_backup_bytes_after"
          printf 'container_inventory_unchanged=true\n'
          printf 'running_container_inventory_unchanged=true\n'
          printf 'tagged_image_inventory_unchanged=true\n'
          printf 'volume_inventory_unchanged=true\n'
          printf 'network_inventory_unchanged=true\n'
          printf 'deploy_worktree_unchanged=true\n'
          docker system df

          if [ "$root_after" -lt "$required_backup_bytes_after" ] \
            || [ "$deploy_after" -lt "$required_backup_bytes_after" ] \
            || [ "$release_context_after" -lt "$required_backup_bytes_after" ] \
            || [ "$docker_after" -lt "$required_backup_bytes_after" ] \
            || [ "$backup_after" -lt "$required_backup_bytes_after" ]; then
            echo "backup_reserve_threshold_satisfied=false"
            echo "Builder cache was the only approved target, but the backup reserve is still insufficient" >&2
            exit 1
          fi
          echo "backup_reserve_threshold_satisfied=true"
          REMOTE
