name: Renew production Let's Encrypt certificate

# Кабинет отдаёт HTTPS из хостового /etc/letsencrypt (bind-mount в nginx).
# Вчерашний деплой приложения сертификат не выпускает и не продлевает.
# Этот workflow отдельно: HTTP-01 на :80 без редиректа, certbot, reload nginx.
#
# Не пересобирает api/web и не ходит в backup/rehearse/deploy.yml.
# Если HTTP-01 ещё не настроен, скрипт применяет nginx.conf/compose из
# github.sha и делает git reset --hard на этот SHA (чтобы дерево на сервере
# не осталось грязным). Образы контейнеров не трогает.
#
# Запуск: gh workflow run renew-letsencrypt.yml -f confirm_renew=true
#   опционально -f force_renewal=true

on:
  schedule:
    # За 30 дней до истечения certbot сам решит, что renew не нужен.
    - cron: "17 4 * * 2"
  workflow_dispatch:
    inputs:
      confirm_renew:
        description: Renew the production TLS certificate and reload nginx
        required: true
        default: false
        type: boolean
      force_renewal:
        description: Force certbot to replace the certificate even if it is not due
        required: false
        default: false
        type: boolean

concurrency:
  group: tls-renew
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    name: Renew TLS on production
    if: github.event_name == 'schedule' || inputs.confirm_renew == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate production SSH host fingerprint
        shell: bash
        env:
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo "Production SSH ED25519 fingerprint variable is missing or invalid"
            exit 1
          }

      - name: SSH and renew certificate
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_RENEW_SHA: ${{ github.sha }}
          FORCE_RENEWAL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_renewal == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || { echo "Production SSH configuration is incomplete"; exit 1; }
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) echo "Invalid SSH host"; exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || { echo "Invalid SSH user"; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || { echo "Invalid SSH port"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          [[ "$EXPECTED_RENEW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid EXPECTED_RENEW_SHA"; exit 1; }
          [[ "$FORCE_RENEWAL" == "true" || "$FORCE_RENEWAL" == "false" ]] || { echo "Invalid FORCE_RENEWAL"; exit 1; }
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "Production SSH fingerprint variable is missing or invalid"; exit 1; }

          ssh_root=$(mktemp -d)
          known_hosts="$ssh_root/known_hosts"
          private_key="$ssh_root/deploy-key"
          trap 'rm -f -- "$known_hosts" "$private_key"; rmdir -- "$ssh_root" 2>/dev/null || true' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 || { echo "Expected exactly one production ED25519 fingerprint"; exit 1; }
          test "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || { echo "Production SSH host fingerprint mismatch"; exit 1; }

          timeout --foreground 15m ssh -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- '$DEPLOY_PATH' '$EXPECTED_RENEW_SHA' '$FORCE_RENEWAL'" <<'REMOTE'
            set -euo pipefail
            DEPLOY_PATH=$1
            EXPECTED_RENEW_SHA=$2
            FORCE_RENEWAL=$3
            [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
            case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
            [[ "$EXPECTED_RENEW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid EXPECTED_RENEW_SHA"; exit 1; }
            [[ "$FORCE_RENEWAL" == "true" || "$FORCE_RENEWAL" == "false" ]] || { echo "Invalid FORCE_RENEWAL"; exit 1; }
            cd "$DEPLOY_PATH"
            exec 9>/tmp/st-michael-production-deploy.lock
            flock -n 9 || { echo "Another production deploy holds the server lock"; exit 1; }
            CANONICAL_REPOSITORY="https://github.com/sereganikitin/st-michael-broker-platform.git"
            git fetch "$CANONICAL_REPOSITORY" "$EXPECTED_RENEW_SHA"
            FETCHED_SHA=$(git rev-parse FETCH_HEAD)
            if [ "$FETCHED_SHA" != "$EXPECTED_RENEW_SHA" ]; then
              echo "Canonical fetch did not return the expected SHA"
              exit 1
            fi
            RENEW_SCRIPT=$(mktemp /tmp/renew-letsencrypt.XXXXXX.sh)
            trap 'rm -f -- "$RENEW_SCRIPT"' EXIT
            git show "$EXPECTED_RENEW_SHA:scripts/renew-letsencrypt.sh" > "$RENEW_SCRIPT"
            chmod 700 "$RENEW_SCRIPT"
            "$RENEW_SCRIPT" "$DEPLOY_PATH" "$EXPECTED_RENEW_SHA" "$FORCE_RENEWAL"
          REMOTE

      - name: Notify Telegram on success
        if: success()
        shell: bash
        env:
          OPS_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          OPS_ALERT_CHAT_ID: ${{ secrets.OPS_ALERT_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$OPS_TELEGRAM_BOT_TOKEN" ] || [ -z "$OPS_ALERT_CHAT_ID" ]; then
            echo "OPS Telegram secrets are not configured; skipping success notice"
            exit 0
          fi
          TEXT="🟢 PROD: сертификат broker.stmichael.ru продлён. HTTPS снова валиден."
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 \
            -X POST "https://api.telegram.org/bot${OPS_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$OPS_ALERT_CHAT_ID" \
            --data-urlencode text="$TEXT" > /dev/null

      - name: Notify Telegram on failure
        if: failure()
        shell: bash
        env:
          OPS_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          OPS_ALERT_CHAT_ID: ${{ secrets.OPS_ALERT_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$OPS_TELEGRAM_BOT_TOKEN" ] || [ -z "$OPS_ALERT_CHAT_ID" ]; then
            echo "OPS Telegram secrets are not configured"
            exit 0
          fi
          TEXT="🔴 PROD: не удалось продлить сертификат broker.stmichael.ru. Браузер показывает NET::ERR_CERT_DATE_INVALID, пока HTTPS не валиден."
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 \
            -X POST "https://api.telegram.org/bot${OPS_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$OPS_ALERT_CHAT_ID" \
            --data-urlencode text="$TEXT" > /dev/null
