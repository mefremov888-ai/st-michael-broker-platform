name: Apply materials rules 2026-09-17

# Разовая операция по решениям владельца 17.09.2026: в СОХРАНЁННОЙ раскладке
# материалов презентации переезжают внутрь проектов, Reels становятся своей
# папкой, разделы «Презентации» и «Презентации проектов» верхнего уровня
# убираются. Обложки, виртуальные подпапки и группы не трогаются.
#
# Боевой режим требует dry_run=false И confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только отчёт, ничего не пишется)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись в прод-БД (нужно вместе с dry_run=false)'
        required: true
        default: false
        type: boolean

concurrency:
  group: apply-materials-rules-20260917
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Run on production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          envs: DRY_RUN_INPUT,CONFIRM_APPLY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show origin/master:scripts/apply-materials-rules-20260917.js > /tmp/apply-materials-rules-20260917.js
            docker cp /tmp/apply-materials-rules-20260917.js st-michael-api:/app/scripts/apply-materials-rules-20260917.js
            MODE=1
            CONFIRM=0
            if [ "$DRY_RUN_INPUT" = "false" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; CONFIRM=1; fi
            docker compose exec -T -e DRY_RUN=$MODE -e CONFIRM=$CONFIRM api node /app/scripts/apply-materials-rules-20260917.js
            echo "=== Готово (DRY_RUN=$MODE) ==="
