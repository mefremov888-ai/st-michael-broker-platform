name: Probe failed Victoria source downloads read-only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compare Node and curl against two failed public originals
        run: node scripts/probe-victoria-downloads.js
