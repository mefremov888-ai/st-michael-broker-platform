name: Rehearse loyalty migration (safe, isolated)

# Ручной запуск. Снимает бэкап живой базы и прогоняет миграцию
# из доверенного master ТОЛЬКО против одноразовой изолированной копии на
# сервере. Поддерживает и legacy-базу без Prisma history, и уже мигрированную
# production-базу с pending migrations — см.
# scripts/rehearse-loyalty-migration.sh для полного описания.
#
# Ничего не пишет и не меняет на боевой базе. Не заменяет шаги 7-8 из
# packages/database/prisma/migrations/README.md (реальное применение на
# проде) — это отдельная, человеко-выполняемая часть с прямым доступом к
# PRODUCTION_DATABASE_URL, которую этот workflow намеренно не трогает.

on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rehearse:
    name: Run rehearsal on production server (isolated clone only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate production SSH host fingerprint
        shell: bash
        env:
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo "Production SSH ED25519 fingerprint variable is missing or invalid"
            exit 1
          }

      - name: SSH and rehearse
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_REHEARSAL_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          script_stop: true
          command_timeout: 15m
          envs: DEPLOY_PATH,EXPECTED_REHEARSAL_SHA
          script: |
            set -euo pipefail
            [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
            case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
            [[ "$EXPECTED_REHEARSAL_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid EXPECTED_REHEARSAL_SHA"; exit 1; }
            cd "$DEPLOY_PATH"
            # Той же логикой, что и deploy.yml: не доверяем локальному origin
            # (был случай, когда он смотрел на форк — см. project_deploy_origin_trap),
            # берём скрипт fetch-ом с явного канонического URL.
            CANONICAL_REPOSITORY="https://github.com/sereganikitin/st-michael-broker-platform.git"
            git fetch "$CANONICAL_REPOSITORY" master
            TRUSTED_REHEARSAL_SHA=$(git rev-parse FETCH_HEAD)
            if [ "$TRUSTED_REHEARSAL_SHA" != "$EXPECTED_REHEARSAL_SHA" ]; then
              echo "Canonical master changed or this workflow was not dispatched for current master; rerun rehearsal."
              exit 1
            fi
            REHEARSAL_SCRIPT=$(mktemp /tmp/rehearse-loyalty-migration.XXXXXX.sh)
            trap 'rm -f -- "$REHEARSAL_SCRIPT"' EXIT
            git show "$EXPECTED_REHEARSAL_SHA:scripts/rehearse-loyalty-migration.sh" > "$REHEARSAL_SCRIPT"
            chmod 700 "$REHEARSAL_SCRIPT"
            "$REHEARSAL_SCRIPT" "$DEPLOY_PATH" "$EXPECTED_REHEARSAL_SHA"
