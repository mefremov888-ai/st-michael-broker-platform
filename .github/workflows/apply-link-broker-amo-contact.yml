name: Link broker card to amoCRM contact

# 2026-09-21: привязка карточки брокера в кабинете к существующему контакту
# amoCRM по его id. Нужна, когда у брокера контакт в amo есть (иногда не один),
# а в карточке кабинета amoContactId пуст — тогда заявки на него зависают с
# BROKER_AMO_CONTACT_MISSING. Скрипт scripts/link-broker-amo-contact.js
# (решение владельца 07.09, п.17): читает контакты из amo, находит карточку
# по телефону, при APPLY пишет Broker.amoContactId. Ничего в amo не создаёт.
#
# Боевой режим требует dry_run=false И confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      contact_ids:
        description: 'ID контактов amoCRM через запятую (например 46999175)'
        required: true
        type: string
      dry_run:
        description: 'Dry-run (только отчёт, ничего не пишется)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись в прод-БД (нужно вместе с dry_run=false)'
        required: true
        default: false
        type: boolean

concurrency:
  group: apply-link-broker-amo-contact
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Run on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONTACT_IDS_INPUT: ${{ inputs.contact_ids }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          envs: CONTACT_IDS_INPUT,DRY_RUN_INPUT,CONFIRM_APPLY
          script: |
            set -e
            echo "$CONTACT_IDS_INPUT" | grep -qE '^[0-9]+([ ,;][ ]*[0-9]+)*$' || { echo "contact_ids: только числа через запятую"; exit 2; }
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show origin/master:scripts/link-broker-amo-contact.js > /tmp/link-broker-amo-contact.js
            docker cp /tmp/link-broker-amo-contact.js st-michael-api:/app/scripts/link-broker-amo-contact.js
            MODE=1
            if [ "$DRY_RUN_INPUT" = "false" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; fi
            if [ "$MODE" = "1" ]; then echo "=== DRY-RUN (без записи) ==="; else echo "=== APPLY (запись в БД) ==="; fi
            docker compose exec -T -e DRY_RUN=$MODE -e CONTACT_IDS="$CONTACT_IDS_INPUT" api node /app/scripts/link-broker-amo-contact.js
            echo "=== Готово (DRY_RUN=$MODE) ==="
