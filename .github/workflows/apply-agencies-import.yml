name: Apply agencies import (master registry)

# 2026-09-05: массовый импорт агентств в карточки кабинета из сводного
# реестра. Данные лежат в data-ветке (data/agencies-import.json, записи
# test=true туда не включены), скрипт — в master
# (scripts/import-agencies-master.js). Только создаёт недостающие Agency
# (дедуп по ИНН и нормализованному названию, копия normalizeAgencyMatchKey),
# НИЧЕГО не обновляет и не удаляет.
#
# Боевой режим требует dry_run=false И confirm_apply=true — любая другая
# комбинация выполняется как dry-run (только отчёт, без записи).
#
# Запуск: Actions → "Apply agencies import (master registry)" → Run workflow
# (сначала dry_run=true, проверить счётчики и топ-20 в логе,
# затем dry_run=false + confirm_apply=true).

on:
  workflow_dispatch:
    inputs:
      data_branch:
        description: Branch with data/agencies-import.json
        required: true
        default: data/agencies-import-20260905
        type: string
      dry_run:
        description: 'Dry-run (только отчёт, ничего не пишется)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись в прод-БД (нужно вместе с dry_run=false)'
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  import:
    name: Import agencies on production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH and run import
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATA_BRANCH: ${{ inputs.data_branch }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          envs: DATA_BRANCH,DRY_RUN_INPUT,CONFIRM_APPLY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin "$DATA_BRANCH"
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show "origin/$DATA_BRANCH:data/agencies-import.json" > /tmp/agencies-import.json
            git show origin/master:scripts/import-agencies-master.js > /tmp/import-agencies-master.js
            docker cp /tmp/agencies-import.json st-michael-api:/app/agencies-import.json
            docker cp /tmp/import-agencies-master.js st-michael-api:/app/scripts/import-agencies-master.js
            MODE=1
            if [ "$DRY_RUN_INPUT" = "false" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; fi
            if [ "$MODE" = "1" ]; then echo "=== DRY-RUN (без записи) ==="; else echo "=== APPLY (запись в БД) ==="; fi
            docker compose exec -T -e DRY_RUN=$MODE api node /app/scripts/import-agencies-master.js /app/agencies-import.json
            echo "=== Готово (DRY_RUN=$MODE) ==="
