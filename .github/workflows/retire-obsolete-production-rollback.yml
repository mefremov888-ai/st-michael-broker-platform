              exit 1
              ;;
          esac
          expected_current_tags=$(
            printf '%s\n' "$expected_retained_tags"
            if [ "$target_api_present" = "true" ]; then printf '%s\n' "$TARGET_API_TAG"; fi
            if [ "$target_web_present" = "true" ]; then printf '%s\n' "$TARGET_WEB_TAG"; fi
          )
          expected_current_tags=$(printf '%s\n' "$expected_current_tags" | sort)
          if [ "$rollback_tags_before" != "$expected_current_tags" ]; then
            print_rollback_tag_diagnostics "$rollback_tags_before"
            echo "Rollback inventory is not an exact inspectable state"
            exit 1
          fi
          if [ "$operation" = "inspect" ]; then
            test "$confirm_retirement" = "false" || { echo "Inspect mode must not carry retirement confirmation on the production host"; exit 1; }
          else
