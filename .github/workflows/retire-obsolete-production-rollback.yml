              inspect_stage_failed "retained_web_${newer_timestamp}.image_id"
              exit 1
            fi
            image_has_prefix "$newer_api_id" "${NEWER_API_PREFIXES[$newer_index]}" || { echo "A retained API rollback does not match the prior read-only audit"; exit 1; }
            image_has_prefix "$newer_web_id" "${NEWER_WEB_PREFIXES[$newer_index]}" || { echo "A retained web rollback does not match the prior read-only audit"; exit 1; }
            case "$newer_timestamp" in
              20260825-145230|20260825-160034)
                test "$newer_api_id" = "$DUPLICATE_RETAINED_API_IMAGE_ID" || { echo "A duplicate retained API image ID differs from the confirmed audit"; exit 1; }
                test "$newer_web_id" = "$DUPLICATE_RETAINED_WEB_IMAGE_ID" || { echo "A duplicate retained web image ID differs from the confirmed audit"; exit 1; }
                ;;
            esac
            if ! newer_record_api_id=$(record_value previous_api_image "$newer_record"); then
              inspect_stage_failed "retained_api_${newer_timestamp}.release_record"
              exit 1
            fi
            if ! newer_record_web_id=$(record_value previous_web_image "$newer_record"); then
              inspect_stage_failed "retained_web_${newer_timestamp}.release_record"
              exit 1
            fi
            test "$newer_record_api_id" = "$newer_api_id" || { echo "A retained API rollback disagrees with its release record"; exit 1; }
            test "$newer_record_web_id" = "$newer_web_id" || { echo "A retained web rollback disagrees with its release record"; exit 1; }
            if ! expected_newer_api_repo_tags=$(expected_retained_repo_tags api "$newer_timestamp"); then
              inspect_stage_failed "retained_api_${newer_timestamp}.expected_topology"
              exit 1
            fi
            if ! expected_newer_web_repo_tags=$(expected_retained_repo_tags web "$newer_timestamp"); then
              inspect_stage_failed "retained_web_${newer_timestamp}.expected_topology"
              exit 1
            fi
            if ! newer_api_repo_digest=$(validated_repo_digest_for_tag "$newer_api_tag" "$expected_newer_api_repo_tags" "retained_api_${newer_timestamp}"); then
              inspect_stage_failed "retained_api_${newer_timestamp}.topology"
              exit 1
            fi
            if ! newer_web_repo_digest=$(validated_repo_digest_for_tag "$newer_web_tag" "$expected_newer_web_repo_tags" "retained_web_${newer_timestamp}"); then
              inspect_stage_failed "retained_web_${newer_timestamp}.topology"
              exit 1
            fi
            test "$newer_api_id" != "$target_api_id" -a "$newer_api_id" != "$target_web_id" || { echo "A retained API rollback resolves to a retirement image"; exit 1; }
            test "$newer_web_id" != "$target_api_id" -a "$newer_web_id" != "$target_web_id" || { echo "A retained web rollback resolves to a retirement image"; exit 1; }
            newer_api_ids+=("$newer_api_id")
            newer_web_ids+=("$newer_web_id")
            newer_api_repo_digests+=("$newer_api_repo_digest")
            newer_web_repo_digests+=("$newer_web_repo_digest")
            newer_record_hashes+=("$(sha256sum -- "$newer_record" | awk '{print $1}')")
            newer_override_hashes+=("$(sha256sum -- "$newer_override" | awk '{print $1}')")
            newer_records+=("$newer_record")
            newer_overrides+=("$newer_override")
          done

          full_rollback_inventory_payload=$(
            printf 'target_api=%s\ntarget_api_repo_digest=%s\ntarget_web=%s\ntarget_web_repo_digest=%s\ntarget_record=%s\ntarget_override=%s\n' \
              "$target_api_id" "$target_api_repo_digest" "$target_web_id" "$target_web_repo_digest" \
              "$release_record_sha_before" "$rollback_override_sha_before"
            for newer_index in "${!NEWER_TIMESTAMPS[@]}"; do
              printf 'retained_%s_api=%s\nretained_%s_api_repo_digest=%s\nretained_%s_web=%s\nretained_%s_web_repo_digest=%s\nretained_%s_record=%s\nretained_%s_override=%s\n' \
                "${NEWER_TIMESTAMPS[$newer_index]}" "${newer_api_ids[$newer_index]}" \
                "${NEWER_TIMESTAMPS[$newer_index]}" "${newer_api_repo_digests[$newer_index]}" \
                "${NEWER_TIMESTAMPS[$newer_index]}" "${newer_web_ids[$newer_index]}" \
                "${NEWER_TIMESTAMPS[$newer_index]}" "${newer_web_repo_digests[$newer_index]}" \
                "${NEWER_TIMESTAMPS[$newer_index]}" "${newer_record_hashes[$newer_index]}" \
                "${NEWER_TIMESTAMPS[$newer_index]}" "${newer_override_hashes[$newer_index]}"
            done
          )
          full_rollback_inventory_sha256=$(printf '%s' "$full_rollback_inventory_payload" | sha256sum | awk '{print $1}')
          [[ "$full_rollback_inventory_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "Full rollback inventory SHA-256 is invalid"; exit 1; }
          non_target_image_inventory_before=$(full_non_target_image_inventory "$target_api_id" "$target_web_id")
          assert_non_target_image_inventory_shape "$non_target_image_inventory_before"
          non_target_image_inventory_sha256=$(printf '%s' "$non_target_image_inventory_before" | sha256sum | awk '{print $1}')
          [[ "$non_target_image_inventory_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "Non-target image inventory SHA-256 is invalid"; exit 1; }
          if [ "$operation" = "retire" ]; then
            test "$expected_target_api_image_id" = "$target_api_id" || { echo "Expected API image ID does not match the inspected rollback"; exit 1; }
            test "$expected_target_web_image_id" = "$target_web_id" || { echo "Expected web image ID does not match the inspected rollback"; exit 1; }
            test "$expected_target_api_repo_digest" = "$target_api_repo_digest" || { echo "Expected API repo digest does not match the inspected rollback"; exit 1; }
            test "$expected_target_web_repo_digest" = "$target_web_repo_digest" || { echo "Expected web repo digest does not match the inspected rollback"; exit 1; }
            # RepoDigests that resolve to the same image ID are local names, not a
            # registry pin. Retirement removes the audited image by ID, without prune.
            # Requiring digest=none blocked this pair after inspect already proved the
            # digest maps to sha256:dcac4b4619a4 / sha256:82594645efc6.
            case "$target_api_repo_digest" in
              none|"st-michael-rollback-api@$target_api_id") ;;
              *) echo "Target API repo digest is not a local name for the audited image"; exit 1 ;;
            esac
            case "$target_web_repo_digest" in
              none|"st-michael-rollback-web@$target_web_id") ;;
              *) echo "Target web repo digest is not a local name for the audited image"; exit 1 ;;
            esac
            test "$expected_release_record_sha256" = "$release_record_sha_before" || { echo "Expected release-record SHA-256 does not match"; exit 1; }
            test "$expected_rollback_override_sha256" = "$rollback_override_sha_before" || { echo "Expected rollback-override SHA-256 does not match"; exit 1; }
            test "$expected_full_rollback_inventory_sha256" = "$full_rollback_inventory_sha256" || { echo "Expected full rollback inventory SHA-256 does not match"; exit 1; }
            test "$expected_non_target_image_inventory_sha256" = "$non_target_image_inventory_sha256" || { echo "Expected non-target image inventory SHA-256 does not match"; exit 1; }
          fi

          assert_production_health
          running_container_inventory_before=$(container_inventory running)
          all_container_inventory_before=$(container_inventory all)
          volume_inventory_before=$(volume_inventory)
          network_inventory_before=$(network_inventory)
          running_container_inventory_sha256=$(printf '%s' "$running_container_inventory_before" | sha256sum | awk '{print $1}')
          all_container_inventory_sha256=$(printf '%s' "$all_container_inventory_before" | sha256sum | awk '{print $1}')
          volume_inventory_sha256=$(printf '%s' "$volume_inventory_before" | sha256sum | awk '{print $1}')
          network_inventory_sha256=$(printf '%s' "$network_inventory_before" | sha256sum | awk '{print $1}')
          if ! deploy_worktree_sha256_before=$(deploy_worktree_sha256); then
            inspect_stage_failed "runtime.deploy_worktree"
            exit 1
          fi
          if ! docker_daemon_snapshot_before=$(docker_daemon_snapshot); then
            inspect_stage_failed "runtime.docker_daemon"
            exit 1
          fi
          IFS=: read -r docker_daemon_uptime_seconds docker_daemon_identity_sha256 <<< "$docker_daemon_snapshot_before"
          if ! runtime_audit_before=$(runtime_event_audit); then
            inspect_stage_failed "runtime.events"
            exit 1
          fi
          IFS=: read -r event_window_start event_window_end runtime_event_count risky_runtime_event_count runtime_action_type_sha256 runtime_event_actor_sha256 <<< "$runtime_audit_before"
          for runtime_sha256 in "$running_container_inventory_sha256" "$all_container_inventory_sha256" "$volume_inventory_sha256" \
            "$network_inventory_sha256" "$deploy_worktree_sha256_before" "$docker_daemon_identity_sha256" \
            "$runtime_action_type_sha256" "$runtime_event_actor_sha256"; do
            [[ "$runtime_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "A runtime inventory hash is invalid"; exit 1; }
          done
          test "$risky_runtime_event_count" -eq 0 || { echo "Recent lifecycle/OOM event for a production container blocks retirement"; exit 1; }
          inspection_epoch=$(date -u +%s)
          [[ "$inspection_epoch" =~ ^[0-9]{10}$ ]] || { echo "Inspection epoch is invalid"; exit 1; }

          if [ "$operation" = "retire" ]; then
            IFS=: read -r expected_inspection_epoch expected_daemon_uptime_seconds expected_manifest_full_rollback_sha256 \
              expected_running_container_sha256 expected_all_container_sha256 expected_volume_sha256 expected_network_sha256 \
              expected_deploy_worktree_sha256 expected_daemon_identity_sha256 expected_event_actor_sha256 expected_inspection_evidence_sha256 \
              <<< "$expected_runtime_evidence_manifest"
            evidence_age_seconds=$((inspection_epoch - expected_inspection_epoch))
            test "$evidence_age_seconds" -ge 0 -a "$evidence_age_seconds" -le 900 || { echo "Inspect evidence is older than fifteen minutes or from the future"; exit 1; }
            test "$docker_daemon_uptime_seconds" -ge "$expected_daemon_uptime_seconds" || { echo "Docker daemon restarted after inspect"; exit 1; }
            test "$expected_manifest_full_rollback_sha256" = "$expected_full_rollback_inventory_sha256" || { echo "Runtime manifest rollback hash does not match its exact input"; exit 1; }
            test "$expected_running_container_sha256" = "$running_container_inventory_sha256" || { echo "Running-container inventory changed since inspect"; exit 1; }
            test "$expected_all_container_sha256" = "$all_container_inventory_sha256" || { echo "All-container inventory changed since inspect"; exit 1; }
            test "$expected_volume_sha256" = "$volume_inventory_sha256" || { echo "Docker volume inventory changed since inspect"; exit 1; }
            test "$expected_network_sha256" = "$network_inventory_sha256" || { echo "Docker network inventory changed since inspect"; exit 1; }
            test "$expected_deploy_worktree_sha256" = "$deploy_worktree_sha256_before" || { echo "Deploy worktree changed since inspect"; exit 1; }
            test "$expected_daemon_identity_sha256" = "$docker_daemon_identity_sha256" || { echo "Docker daemon identity changed since inspect"; exit 1; }
            expected_inspection_evidence_payload=$(printf 'epoch=%s\ndaemon_uptime=%s\ntarget_api=%s\ntarget_web=%s\ntarget_repo_digests=%s\nrecord=%s\noverride=%s\nfull_rollback=%s\nnon_target_images=%s\nrunning=%s\nall=%s\nvolumes=%s\nnetworks=%s\ndeploy=%s\ndaemon=%s\nevents=%s\n' \
              "$expected_inspection_epoch" "$expected_daemon_uptime_seconds" "$expected_target_api_image_id" "$expected_target_web_image_id" \
              "$expected_target_repo_digests_manifest" "$expected_release_record_sha256" "$expected_rollback_override_sha256" \
              "$expected_full_rollback_inventory_sha256" "$expected_non_target_image_inventory_sha256" \
              "$expected_running_container_sha256" "$expected_all_container_sha256" "$expected_volume_sha256" "$expected_network_sha256" \
              "$expected_deploy_worktree_sha256" "$expected_daemon_identity_sha256" "$expected_event_actor_sha256")
            test "$(printf '%s' "$expected_inspection_evidence_payload" | sha256sum | awk '{print $1}')" = "$expected_inspection_evidence_sha256" \
              || { echo "Fresh inspect evidence manifest is internally inconsistent"; exit 1; }
          else
            inspection_evidence_payload=$(printf 'epoch=%s\ndaemon_uptime=%s\ntarget_api=%s\ntarget_web=%s\ntarget_repo_digests=%s\nrecord=%s\noverride=%s\nfull_rollback=%s\nnon_target_images=%s\nrunning=%s\nall=%s\nvolumes=%s\nnetworks=%s\ndeploy=%s\ndaemon=%s\nevents=%s\n' \
              "$inspection_epoch" "$docker_daemon_uptime_seconds" "$target_api_id" "$target_web_id" \
              "$target_api_repo_digest|$target_web_repo_digest" "$release_record_sha_before" "$rollback_override_sha_before" \
              "$full_rollback_inventory_sha256" "$non_target_image_inventory_sha256" \
              "$running_container_inventory_sha256" "$all_container_inventory_sha256" "$volume_inventory_sha256" "$network_inventory_sha256" \
              "$deploy_worktree_sha256_before" "$docker_daemon_identity_sha256" "$runtime_event_actor_sha256")
            inspection_evidence_sha256=$(printf '%s' "$inspection_evidence_payload" | sha256sum | awk '{print $1}')
            runtime_evidence_manifest="$inspection_epoch:$docker_daemon_uptime_seconds:$full_rollback_inventory_sha256:$running_container_inventory_sha256:$all_container_inventory_sha256:$volume_inventory_sha256:$network_inventory_sha256:$deploy_worktree_sha256_before:$docker_daemon_identity_sha256:$runtime_event_actor_sha256:$inspection_evidence_sha256"
          fi

          root_before=$(available_bytes /)
          deploy_before=$(available_bytes "$deploy_root")
          release_context_before=$(available_bytes /tmp)
          docker_before=$(available_bytes "$docker_root")
          backup_before=$(available_bytes "$backup_storage_path")
          require_uint "$root_before"
          require_uint "$deploy_before"
          require_uint "$release_context_before"
          require_uint "$docker_before"
          require_uint "$backup_before"

          printf 'root_available_bytes_before=%s\n' "$root_before"
          printf 'deploy_available_bytes_before=%s\n' "$deploy_before"
          printf 'release_context_available_bytes_before=%s\n' "$release_context_before"
          printf 'docker_root_available_bytes_before=%s\n' "$docker_before"
          printf 'backup_available_bytes_before=%s\n' "$backup_before"
          printf 'required_backup_available_bytes=%s\n' "$required_backup_available_bytes"

          if [ "$operation" = "inspect" ]; then
            print_rollback_tag_diagnostics "$rollback_tags_before"
            printf 'rollback_tag_count=%s\n' "$rollback_tag_count"
            printf 'rollback_tag_inventory_sha256=%s\n' "$rollback_tag_inventory_sha256"
            printf 'target_api_tag_present=%s\n' "$target_api_present"
            printf 'target_web_tag_present=%s\n' "$target_web_present"
            printf 'target_api_image_id=%s\n' "$target_api_id"
            printf 'target_api_repo_digest=%s\n' "$target_api_repo_digest"
            printf 'target_web_image_id=%s\n' "$target_web_id"
            printf 'target_web_repo_digest=%s\n' "$target_web_repo_digest"
            printf 'target_repo_digests_manifest=%s|%s\n' "$target_api_repo_digest" "$target_web_repo_digest"
            printf 'release_record_sha256=%s\n' "$release_record_sha_before"
            printf 'rollback_override_sha256=%s\n' "$rollback_override_sha_before"
            printf 'full_rollback_inventory_sha256=%s\n' "$full_rollback_inventory_sha256"
            printf 'non_target_image_inventory_sha256=%s\n' "$non_target_image_inventory_sha256"
            printf 'running_container_inventory_sha256=%s\n' "$running_container_inventory_sha256"
            printf 'all_container_inventory_sha256=%s\n' "$all_container_inventory_sha256"
            printf 'volume_inventory_sha256=%s\n' "$volume_inventory_sha256"
            printf 'network_inventory_sha256=%s\n' "$network_inventory_sha256"
            printf 'deploy_worktree_sha256=%s\n' "$deploy_worktree_sha256_before"
            printf 'docker_daemon_uptime_seconds=%s\n' "$docker_daemon_uptime_seconds"
            printf 'docker_daemon_identity_sha256=%s\n' "$docker_daemon_identity_sha256"
            printf 'runtime_event_count=%s\n' "$runtime_event_count"
            printf 'risky_runtime_event_count=%s\n' "$risky_runtime_event_count"
            printf 'runtime_action_type_sha256=%s\n' "$runtime_action_type_sha256"
            printf 'runtime_event_actor_sha256=%s\n' "$runtime_event_actor_sha256"
            printf 'runtime_evidence_manifest=%s\n' "$runtime_evidence_manifest"
            echo "inspection_only=true"
            exit 0
          fi

          # Close the normal preflight-to-mutation window if master advanced
          # while the read-only production evidence was being collected.
          assert_canonical_master
          rollback_tags_pre_mutation=$(rollback_tag_inventory)
          if [ "$rollback_tags_pre_mutation" != "$rollback_tags_before" ]; then
            print_rollback_tag_diagnostics "$rollback_tags_pre_mutation"
            echo "Rollback tags changed during preflight"
            exit 1
          fi
          if [ "$target_api_present" = "true" ]; then
            if ! preflight_target_api_id=$(image_id_for_tag "$TARGET_API_TAG"); then
              inspect_stage_failed "preflight.target_api.image_id"
              exit 1
            fi
            test "$preflight_target_api_id" = "$target_api_id" || { echo "Target API tag changed during preflight"; exit 1; }
            if ! preflight_target_api_repo_digest=$(validated_repo_digest_for_tag "$TARGET_API_TAG" "$TARGET_API_TAG" "preflight.target_api"); then
              inspect_stage_failed "preflight.target_api.topology"
              exit 1
            fi
            test "$preflight_target_api_repo_digest" = "$target_api_repo_digest" || { echo "Target API digest changed during preflight"; exit 1; }
          elif docker image inspect "$target_api_id" >/dev/null 2>&1; then
            echo "Missing target API tag regained a local image reference"
            exit 1
          fi
          if [ "$target_web_present" = "true" ]; then
            if ! preflight_target_web_id=$(image_id_for_tag "$TARGET_WEB_TAG"); then
              inspect_stage_failed "preflight.target_web.image_id"
              exit 1
            fi
            test "$preflight_target_web_id" = "$target_web_id" || { echo "Target web tag changed during preflight"; exit 1; }
            if ! preflight_target_web_repo_digest=$(validated_repo_digest_for_tag "$TARGET_WEB_TAG" "$TARGET_WEB_TAG" "preflight.target_web"); then
              inspect_stage_failed "preflight.target_web.topology"
              exit 1
            fi
            test "$preflight_target_web_repo_digest" = "$target_web_repo_digest" || { echo "Target web digest changed during preflight"; exit 1; }
          elif docker image inspect "$target_web_id" >/dev/null 2>&1; then
            echo "Missing target web tag regained a local image reference"
            exit 1
          fi
          assert_exact_release_record_shape "$RELEASE_RECORD" "$TARGET_COMMIT"
          assert_exact_rollback_override "$ROLLBACK_OVERRIDE" "$TARGET_API_TAG" "$TARGET_WEB_TAG"
          test "$(sha256sum -- "$RELEASE_RECORD" | awk '{print $1}')" = "$release_record_sha_before" || { echo "Target release record changed during preflight"; exit 1; }
          test "$(sha256sum -- "$ROLLBACK_OVERRIDE" | awk '{print $1}')" = "$rollback_override_sha_before" || { echo "Target rollback override changed during preflight"; exit 1; }
          assert_no_container_uses_image "$target_api_id"
          assert_no_container_uses_image "$target_web_id"
          for newer_index in "${!NEWER_TIMESTAMPS[@]}"; do
            newer_timestamp=${NEWER_TIMESTAMPS[$newer_index]}
            newer_api_tag="st-michael-rollback-api:$newer_timestamp"
            newer_web_tag="st-michael-rollback-web:$newer_timestamp"
            assert_exact_release_record_shape "${newer_records[$newer_index]}" "${NEWER_TARGET_COMMITS[$newer_index]}"
            assert_exact_rollback_override "${newer_overrides[$newer_index]}" "$newer_api_tag" "$newer_web_tag"
            if ! preflight_newer_api_id=$(image_id_for_tag "$newer_api_tag"); then
              inspect_stage_failed "preflight.retained_api_${newer_timestamp}.image_id"
              exit 1
            fi
            if ! preflight_newer_web_id=$(image_id_for_tag "$newer_web_tag"); then
              inspect_stage_failed "preflight.retained_web_${newer_timestamp}.image_id"
              exit 1
            fi
            test "$preflight_newer_api_id" = "${newer_api_ids[$newer_index]}" || { echo "A retained API image changed during preflight"; exit 1; }
            test "$preflight_newer_web_id" = "${newer_web_ids[$newer_index]}" || { echo "A retained web image changed during preflight"; exit 1; }
            if ! preflight_expected_newer_api_repo_tags=$(expected_retained_repo_tags api "$newer_timestamp"); then
              inspect_stage_failed "preflight.retained_api_${newer_timestamp}.expected_topology"
              exit 1
            fi
            if ! preflight_expected_newer_web_repo_tags=$(expected_retained_repo_tags web "$newer_timestamp"); then
              inspect_stage_failed "preflight.retained_web_${newer_timestamp}.expected_topology"
              exit 1
            fi
            if ! preflight_newer_api_repo_digest=$(validated_repo_digest_for_tag "$newer_api_tag" "$preflight_expected_newer_api_repo_tags" "preflight.retained_api_${newer_timestamp}"); then
              inspect_stage_failed "preflight.retained_api_${newer_timestamp}.topology"
              exit 1
            fi
            if ! preflight_newer_web_repo_digest=$(validated_repo_digest_for_tag "$newer_web_tag" "$preflight_expected_newer_web_repo_tags" "preflight.retained_web_${newer_timestamp}"); then
              inspect_stage_failed "preflight.retained_web_${newer_timestamp}.topology"
              exit 1
            fi
            test "$preflight_newer_api_repo_digest" = "${newer_api_repo_digests[$newer_index]}" || { echo "A retained API digest changed during preflight"; exit 1; }
            test "$preflight_newer_web_repo_digest" = "${newer_web_repo_digests[$newer_index]}" || { echo "A retained web digest changed during preflight"; exit 1; }
            test "$(sha256sum -- "${newer_records[$newer_index]}" | awk '{print $1}')" = "${newer_record_hashes[$newer_index]}" || { echo "A retained release record changed during preflight"; exit 1; }
            test "$(sha256sum -- "${newer_overrides[$newer_index]}" | awk '{print $1}')" = "${newer_override_hashes[$newer_index]}" || { echo "A retained rollback override changed during preflight"; exit 1; }
          done
          test "$(full_non_target_image_inventory "$target_api_id" "$target_web_id")" = "$non_target_image_inventory_before" || { echo "Non-target image inventory changed during preflight"; exit 1; }
          test "$(container_inventory running)" = "$running_container_inventory_before" || { echo "Running containers changed during preflight"; exit 1; }
          test "$(container_inventory all)" = "$all_container_inventory_before" || { echo "All containers changed during preflight"; exit 1; }
          test "$(volume_inventory)" = "$volume_inventory_before" || { echo "Docker volumes changed during preflight"; exit 1; }
          test "$(network_inventory)" = "$network_inventory_before" || { echo "Docker networks changed during preflight"; exit 1; }
          if ! deploy_worktree_sha256_pre_mutation=$(deploy_worktree_sha256); then
            inspect_stage_failed "pre_mutation.deploy_worktree"
            exit 1
          fi
          test "$deploy_worktree_sha256_pre_mutation" = "$deploy_worktree_sha256_before" || { echo "Deploy worktree changed during preflight"; exit 1; }
          if ! docker_daemon_snapshot_pre_mutation=$(docker_daemon_snapshot); then
            inspect_stage_failed "pre_mutation.docker_daemon"
            exit 1
          fi
          IFS=: read -r docker_daemon_uptime_pre_mutation docker_daemon_identity_pre_mutation <<< "$docker_daemon_snapshot_pre_mutation"
          test "$docker_daemon_identity_pre_mutation" = "$docker_daemon_identity_sha256" || { echo "Docker daemon changed during preflight"; exit 1; }
          if ! runtime_audit_pre_mutation=$(runtime_event_audit); then
            inspect_stage_failed "pre_mutation.events"
            exit 1
          fi
          IFS=: read -r pre_event_start pre_event_end pre_event_count pre_risky_event_count pre_action_type_sha256 pre_event_actor_sha256 <<< "$runtime_audit_pre_mutation"
          test "$pre_risky_event_count" -eq 0 || { echo "A recent production container event blocks retirement"; exit 1; }
          assert_production_health
          assert_canonical_master

          retired_count=0
          if [ "$target_api_present" = "true" ]; then
            if ! boundary_target_api_id=$(image_id_for_tag "$TARGET_API_TAG"); then
              inspect_stage_failed "mutation_boundary.target_api.image_id"
              exit 1
            fi
            test "$boundary_target_api_id" = "$target_api_id" || { echo "Target API tag changed at mutation boundary"; exit 1; }
            if ! boundary_target_api_repo_digest=$(validated_repo_digest_for_tag "$TARGET_API_TAG" "$TARGET_API_TAG" "mutation_boundary.target_api"); then
              inspect_stage_failed "mutation_boundary.target_api.topology"
              exit 1
            fi
            test "$boundary_target_api_repo_digest" = "$target_api_repo_digest" || { echo "Target API digest changed at mutation boundary"; exit 1; }
            assert_no_container_uses_image "$target_api_id"
            docker image rm --no-prune -- "$target_api_id" >/dev/null
            retired_count=$((retired_count + 1))
          fi
          if [ "$target_web_present" = "true" ]; then
            if ! boundary_target_web_id=$(image_id_for_tag "$TARGET_WEB_TAG"); then
              inspect_stage_failed "mutation_boundary.target_web.image_id"
              exit 1
            fi
            test "$boundary_target_web_id" = "$target_web_id" || { echo "Target web tag changed at mutation boundary"; exit 1; }
            if ! boundary_target_web_repo_digest=$(validated_repo_digest_for_tag "$TARGET_WEB_TAG" "$TARGET_WEB_TAG" "mutation_boundary.target_web"); then
              inspect_stage_failed "mutation_boundary.target_web.topology"
              exit 1
            fi
            test "$boundary_target_web_repo_digest" = "$target_web_repo_digest" || { echo "Target web digest changed at mutation boundary"; exit 1; }
            assert_no_container_uses_image "$target_web_id"
            docker image rm --no-prune -- "$target_web_id" >/dev/null
            retired_count=$((retired_count + 1))
          fi

          rollback_tags_after=$(rollback_tag_inventory)
          rollback_tag_count_after=$(printf '%s\n' "$rollback_tags_after" | awk 'NF { count++ } END { print count + 0 }')
          if [ "$rollback_tag_count_after" -ne 12 ]; then
            print_rollback_tag_diagnostics "$rollback_tags_after"
            echo "Post-retirement rollback tag count is not twelve"
            exit 1
          fi
          if [ "$rollback_tags_after" != "$expected_retained_tags" ]; then
            print_rollback_tag_diagnostics "$rollback_tags_after"
            echo "Post-retirement rollback tags differ from the exact retained allowlist"
            exit 1
          fi
          if tag_is_present "$rollback_tags_after" "$TARGET_API_TAG" || tag_is_present "$rollback_tags_after" "$TARGET_WEB_TAG"; then
            echo "An approved obsolete rollback tag still exists after retirement"
            exit 1
          fi
          non_target_image_inventory_after=$(full_non_target_image_inventory "$target_api_id" "$target_web_id")
          assert_non_target_image_inventory_shape "$non_target_image_inventory_after"
          test "$non_target_image_inventory_after" = "$non_target_image_inventory_before" || { echo "A non-target Docker image/tag/digest changed during retirement"; exit 1; }
          test "$(printf '%s' "$non_target_image_inventory_after" | sha256sum | awk '{print $1}')" = "$non_target_image_inventory_sha256" \
            || { echo "Post-retirement non-target image inventory hash changed"; exit 1; }
          all_image_ids_after=$(docker image ls --all --quiet --no-trunc | sort -u)
          if printf '%s\n' "$all_image_ids_after" | grep -Fqx -- "$target_api_id" \
            || printf '%s\n' "$all_image_ids_after" | grep -Fqx -- "$target_web_id"; then
            echo "An approved obsolete rollback image ID still exists after retirement"
            exit 1
          fi
          for newer_index in "${!NEWER_TIMESTAMPS[@]}"; do
            newer_timestamp=${NEWER_TIMESTAMPS[$newer_index]}
            newer_api_tag="st-michael-rollback-api:$newer_timestamp"
            newer_web_tag="st-michael-rollback-web:$newer_timestamp"
            tag_is_present "$rollback_tags_after" "$newer_api_tag" || { echo "A retained API rollback tag disappeared"; exit 1; }
            tag_is_present "$rollback_tags_after" "$newer_web_tag" || { echo "A retained web rollback tag disappeared"; exit 1; }
            if ! post_newer_api_id=$(image_id_for_tag "$newer_api_tag"); then
              inspect_stage_failed "post_mutation.retained_api_${newer_timestamp}.image_id"
              exit 1
            fi
            if ! post_newer_web_id=$(image_id_for_tag "$newer_web_tag"); then
              inspect_stage_failed "post_mutation.retained_web_${newer_timestamp}.image_id"
              exit 1
            fi
            test "$post_newer_api_id" = "${newer_api_ids[$newer_index]}" || { echo "A retained API rollback image ID changed"; exit 1; }
            test "$post_newer_web_id" = "${newer_web_ids[$newer_index]}" || { echo "A retained web rollback image ID changed"; exit 1; }
            if ! post_expected_newer_api_repo_tags=$(expected_retained_repo_tags api "$newer_timestamp"); then
              inspect_stage_failed "post_mutation.retained_api_${newer_timestamp}.expected_topology"
              exit 1
            fi
            if ! post_expected_newer_web_repo_tags=$(expected_retained_repo_tags web "$newer_timestamp"); then
              inspect_stage_failed "post_mutation.retained_web_${newer_timestamp}.expected_topology"
              exit 1
            fi
            if ! post_newer_api_repo_digest=$(validated_repo_digest_for_tag "$newer_api_tag" "$post_expected_newer_api_repo_tags" "post_mutation.retained_api_${newer_timestamp}"); then
              inspect_stage_failed "post_mutation.retained_api_${newer_timestamp}.topology"
              exit 1
            fi
            if ! post_newer_web_repo_digest=$(validated_repo_digest_for_tag "$newer_web_tag" "$post_expected_newer_web_repo_tags" "post_mutation.retained_web_${newer_timestamp}"); then
              inspect_stage_failed "post_mutation.retained_web_${newer_timestamp}.topology"
              exit 1
            fi
            test "$post_newer_api_repo_digest" = "${newer_api_repo_digests[$newer_index]}" || { echo "A retained API rollback digest reference changed"; exit 1; }
            test "$post_newer_web_repo_digest" = "${newer_web_repo_digests[$newer_index]}" || { echo "A retained web rollback digest reference changed"; exit 1; }
            assert_private_regular_file "${newer_records[$newer_index]}" "$deploy_uid"
            assert_private_regular_file "${newer_overrides[$newer_index]}" "$deploy_uid"
            test "$(sha256sum -- "${newer_records[$newer_index]}" | awk '{print $1}')" = "${newer_record_hashes[$newer_index]}" || { echo "A retained release record changed"; exit 1; }
            test "$(sha256sum -- "${newer_overrides[$newer_index]}" | awk '{print $1}')" = "${newer_override_hashes[$newer_index]}" || { echo "A retained rollback override changed"; exit 1; }
          done
          assert_private_regular_file "$RELEASE_RECORD" "$deploy_uid"
          assert_private_regular_file "$ROLLBACK_OVERRIDE" "$deploy_uid"
          test "$(sha256sum -- "$RELEASE_RECORD" | awk '{print $1}')" = "$release_record_sha_before" || { echo "Target release record changed during retirement"; exit 1; }
          test "$(sha256sum -- "$ROLLBACK_OVERRIDE" | awk '{print $1}')" = "$rollback_override_sha_before" || { echo "Target rollback override changed during retirement"; exit 1; }
          running_container_inventory_after=$(container_inventory running)
          all_container_inventory_after=$(container_inventory all)
          volume_inventory_after=$(volume_inventory)
          network_inventory_after=$(network_inventory)
          test "$running_container_inventory_after" = "$running_container_inventory_before" || { echo "Running-container inventory changed during retirement"; exit 1; }
          test "$all_container_inventory_after" = "$all_container_inventory_before" || { echo "All-container inventory changed during retirement"; exit 1; }
          test "$volume_inventory_after" = "$volume_inventory_before" || { echo "Docker volume inventory changed during retirement"; exit 1; }
          test "$network_inventory_after" = "$network_inventory_before" || { echo "Docker network inventory changed during retirement"; exit 1; }
          if ! deploy_worktree_sha256_after=$(deploy_worktree_sha256); then
            inspect_stage_failed "post_mutation.deploy_worktree"
            exit 1
          fi
          test "$deploy_worktree_sha256_after" = "$deploy_worktree_sha256_before" || { echo "Deploy worktree changed during retirement"; exit 1; }
          if ! docker_daemon_snapshot_after=$(docker_daemon_snapshot); then
            inspect_stage_failed "post_mutation.docker_daemon"
            exit 1
          fi
          IFS=: read -r docker_daemon_uptime_after docker_daemon_identity_after <<< "$docker_daemon_snapshot_after"
          test "$docker_daemon_identity_after" = "$docker_daemon_identity_sha256" || { echo "Docker daemon identity changed during retirement"; exit 1; }
          if ! runtime_audit_after=$(runtime_event_audit); then
            inspect_stage_failed "post_mutation.events"
            exit 1
          fi
          IFS=: read -r post_event_start post_event_end post_event_count post_risky_event_count post_action_type_sha256 post_event_actor_sha256 <<< "$runtime_audit_after"
          test "$post_risky_event_count" -eq 0 || { echo "A production container lifecycle/OOM event occurred during retirement"; exit 1; }
          assert_production_health
          post_actual_database=$(docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atqc "SELECT current_database()")
          post_actual_system_identifier=$(docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atqc "SELECT system_identifier FROM pg_control_system()")
          post_broker_rows=$(docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atqc "SELECT COUNT(*) FROM public.brokers")
          post_database_size_bytes=$(docker exec st-michael-postgres psql -U postgres -d broker_platform --no-psqlrc -Atqc "SELECT pg_database_size(current_database())")
          test "$post_actual_database" = "broker_platform" || { echo "Post-retirement production database name mismatch"; exit 1; }
          test "$post_actual_system_identifier" = "$production_pg_system_identifier" || { echo "Post-retirement database system identifier mismatch"; exit 1; }
          [[ "$post_broker_rows" =~ ^[0-9]+$ ]] && test "$post_broker_rows" -ge "$production_min_broker_rows" || { echo "Post-retirement broker-row invariant failed"; exit 1; }
          [[ "$post_database_size_bytes" =~ ^[1-9][0-9]{0,17}$ ]] || { echo "Post-retirement database size is invalid"; exit 1; }
          required_backup_available_bytes_after=$((MIN_AVAILABLE_BYTES + post_database_size_bytes + BACKUP_SIZE_OVERHEAD_BYTES))
          test "$required_backup_available_bytes_after" -gt "$MIN_AVAILABLE_BYTES" || { echo "Post-retirement backup headroom calculation is invalid"; exit 1; }

          root_after=$(available_bytes /)
          deploy_after=$(available_bytes "$deploy_root")
          release_context_after=$(available_bytes /tmp)
          docker_after=$(available_bytes "$docker_root")
          backup_after=$(available_bytes "$backup_storage_path")
          require_uint "$root_after"
          require_uint "$deploy_after"
          require_uint "$release_context_after"
          require_uint "$docker_after"
          require_uint "$backup_after"
          printf 'retired_rollback_tags=%s\n' "$retired_count"
          printf 'rollback_metadata_preserved=true\n'
          printf 'root_available_bytes_after=%s\n' "$root_after"
          printf 'deploy_available_bytes_after=%s\n' "$deploy_after"
          printf 'release_context_available_bytes_after=%s\n' "$release_context_after"
          printf 'docker_root_available_bytes_after=%s\n' "$docker_after"
          printf 'backup_available_bytes_after=%s\n' "$backup_after"
          printf 'required_backup_available_bytes_after=%s\n' "$required_backup_available_bytes_after"
          printf 'post_runtime_event_count=%s\n' "$post_event_count"
          printf 'post_risky_runtime_event_count=%s\n' "$post_risky_event_count"
          printf 'post_runtime_action_type_sha256=%s\n' "$post_action_type_sha256"
          printf 'post_runtime_event_actor_sha256=%s\n' "$post_event_actor_sha256"

          if [ "$root_after" -lt "$MIN_AVAILABLE_BYTES" ] \
            || [ "$deploy_after" -lt "$MIN_AVAILABLE_BYTES" ] \
            || [ "$release_context_after" -lt "$MIN_AVAILABLE_BYTES" ] \
            || [ "$docker_after" -lt "$MIN_AVAILABLE_BYTES" ] \
            || [ "$backup_after" -lt "$required_backup_available_bytes_after" ]; then
            echo "backup_reserve_threshold_satisfied=false"
            echo "Approved rollback retirement completed, but conservative production backup headroom is still insufficient" >&2
            exit 1
          fi
          echo "backup_reserve_threshold_satisfied=true"
          REMOTE
