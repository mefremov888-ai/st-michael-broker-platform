          fi

          if ! target_api_id=$(record_value previous_api_image "$RELEASE_RECORD"); then
            inspect_stage_failed "target_api.release_record"
            exit 1
          fi
          if ! target_web_id=$(record_value previous_web_image "$RELEASE_RECORD"); then
            inspect_stage_failed "target_web.release_record"
            exit 1
          fi
          [[ "$target_api_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Target API image ID in the release record is invalid"; exit 1; }
          [[ "$target_web_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Target web image ID in the release record is invalid"; exit 1; }
          image_has_prefix "$target_api_id" "$TARGET_API_PREFIX" || { echo "Target API rollback image does not match the prior read-only audit"; exit 1; }
          image_has_prefix "$target_web_id" "$TARGET_WEB_PREFIX" || { echo "Target web rollback image does not match the prior read-only audit"; exit 1; }
          test "$target_api_id" != "$target_web_id" || { echo "Rollback API and web unexpectedly resolve to the same image"; exit 1; }
          if [ "$target_api_present" = "true" ]; then
