name: Apply Anna ↔ ours links (no merge)

# 2026-09-07 (решения владельца): базу Анны НЕ сливать; записать обратимые
# сцепки LoyaltyEntityLink: брокеры по телефону (1:1; при нескольких наших
# карточках — самая активная), агентства по ИНН / уникальному названию.
# По умолчанию dry-run. Запись — dry_run=false + confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только отчёт)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись сцепок (нужно вместе с dry_run=false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: apply-anna-links
  cancel-in-progress: false

jobs:
  link:
    name: Link on production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_INPUT: ${{ inputs.dry_run }}
          CONFIRM_INPUT: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 18m
          envs: DRY_INPUT,CONFIRM_INPUT
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            git show origin/master:scripts/link-anna-entities.js > /tmp/link-anna-entities.js
            git show origin/master:scripts/enrich-agencies-from-amo.js > /tmp/enrich-agencies-from-amo.js
            docker cp /tmp/link-anna-entities.js st-michael-api:/app/scripts/link-anna-entities.js
            docker cp /tmp/enrich-agencies-from-amo.js st-michael-api:/app/scripts/enrich-agencies-from-amo.js
            DRY=1
            if [ "$DRY_INPUT" = "false" ]; then
              if [ "$CONFIRM_INPUT" != "true" ]; then echo "dry_run=false требует confirm_apply=true"; exit 1; fi
              DRY=0
            fi
            docker compose exec -T -e DRY_RUN=$DRY api node /app/scripts/link-anna-entities.js
