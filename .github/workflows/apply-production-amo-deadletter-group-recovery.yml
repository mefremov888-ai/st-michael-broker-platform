name: Apply production amo deadletter phone-group recovery

# Purpose-built, one-shot recovery. The reviewed plan and apply are bound to
# one exact deployed master SHA and one HMAC-signed 12-row/9-phone cohort.
# Requeue is forbidden; at most one contact and one lead POST are armed per
# phone group, with every sibling linked atomically.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_AMO_DEADLETTER_GROUP_RECOVERY"
        required: true
        type: string
      exact_sha:
        description: "Exact deployed 40-character master SHA"
        required: true
        type: string
      reviewed_plan_run_id:
        description: "Successful exact-SHA signed plan run ID (<24h)"
        required: true
        type: string
      cohort_digest:
        description: "Reviewed 64-character signed cohort digest"
        required: true
        type: string
      manifest:
        description: "Exact ordered plan manifest (queueRows=12,...,requeues=0)"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    steps:
      - name: Checkout exact apply source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate gates and run signed recovery
        shell: bash
        env:
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_EXACT_SHA: ${{ inputs.exact_sha }}
          REVIEWED_PLAN_RUN_ID: ${{ inputs.reviewed_plan_run_id }}
          EXPECTED_COHORT_DIGEST: ${{ inputs.cohort_digest }}
          EXPECTED_MANIFEST: ${{ inputs.manifest }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          CANONICAL_REPOSITORY: sereganikitin/st-michael-broker-platform
          PLAN_WORKFLOW_PATH: .github/workflows/inspect-production-amo-deadletter-group-recovery-plan.yml
          HEALTH_URL: https://broker.stmichael.ru/api/health
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          COHORT_ATTESTATION_KEY: ${{ secrets.BROKER_CONTACT_COHORT_ATTESTATION_KEY }}
        run: |
          set -euo pipefail
          test "$REQUEST_CONFIRMATION" = "APPLY_AMO_DEADLETTER_GROUP_RECOVERY" || { echo "Exact confirmation required"; exit 1; }
          test "$EXPECTED_REPOSITORY" = "$CANONICAL_REPOSITORY" || { echo "Canonical repository required"; exit 1; }
          test "$EXPECTED_REF" = "refs/heads/master" || { echo "Master required"; exit 1; }
          [[ "$EXPECTED_CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid checkout SHA"; exit 1; }
          test "$REQUEST_EXACT_SHA" = "$EXPECTED_CHECKOUT_SHA" || { echo "Exact SHA mismatch"; exit 1; }
          test "$(git rev-parse HEAD)" = "$REQUEST_EXACT_SHA" || { echo "Checkout mismatch"; exit 1; }
          [[ "$REVIEWED_PLAN_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]] || { echo "Invalid reviewed plan run ID"; exit 1; }
          [[ "$EXPECTED_COHORT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid cohort digest"; exit 1; }
          [[ "$EXPECTED_MANIFEST" =~ ^queueRows=12,phoneGroups=9,createGroups=9,blockedGroups=0,clientContactCreates=([0-9]|1[0-2]),agencyRepairs=([0-9]|1[0-2]),maxLeadPosts=9,requeues=0$ ]] || { echo "Invalid or non-executable manifest"; exit 1; }
          test -n "$SSH_HOST" -a -n "$SSH_USER" -a -n "$SSH_PRIVATE_KEY" -a -n "$DEPLOY_PATH" || { echo "SSH configuration incomplete"; exit 1; }
          case "$SSH_HOST" in ""|-*|*[[:space:]]*) echo "Invalid SSH host"; exit 1;; esac
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,63}$ ]] || { echo "Invalid SSH user"; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 -a "$SSH_PORT" -le 65535 || { echo "Invalid SSH port"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy path"; exit 1; }
          case "$DEPLOY_PATH/" in *"/../"*|*"/./"*|*"//"*) echo "Unsafe deploy path"; exit 1;; esac
          [[ "$EXPECTED_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "Invalid SSH fingerprint"; exit 1; }

          core_path=scripts/amo-deadletter-group-recovery-core.js
          plan_path=scripts/inspect-amo-deadletter-group-recovery-plan.js
          legacy_path=scripts/inspect-amo-fixation-lead-reconciliation.js
          apply_path=scripts/apply-amo-deadletter-group-recovery.js
          for source in "$core_path" "$plan_path" "$legacy_path" "$apply_path"; do
            test -f "$source" -a ! -L "$source" || { echo "Unsafe recovery source"; exit 1; }
          done
          core_sha=$(sha256sum -- "$core_path" | awk '{print $1}')
          plan_sha=$(sha256sum -- "$plan_path" | awk '{print $1}')
          legacy_sha=$(sha256sum -- "$legacy_path" | awk '{print $1}')
          apply_sha=$(sha256sum -- "$apply_path" | awk '{print $1}')
          for digest in "$core_sha" "$plan_sha" "$legacy_sha" "$apply_sha"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid source digest"; exit 1; }
          done
          for tool in awk base64 cp curl date gh git jq mkdir mktemp sha256sum sort ssh ssh-keygen ssh-keyscan tar timeout wc; do
            command -v "$tool" >/dev/null || { echo "Required tool missing"; exit 1; }
          done

          health=$(curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 "$HEALTH_URL")
          deployed_sha=$(printf '%s' "$health" | jq -er '.deployedSha | select(type == "string" and test("^[0-9a-f]{40}$"))')
          unset health
          test "$deployed_sha" = "$REQUEST_EXACT_SHA" || { echo "Public production SHA mismatch"; exit 1; }

          runner_temp=${RUNNER_TEMP:-/tmp}
          test -d "$runner_temp" -a ! -L "$runner_temp" || { echo "Unsafe runner temp"; exit 1; }
          run_json=$(mktemp "$runner_temp/amo-deadletter-reviewed-run.XXXXXX")
          trap 'rm -f -- "$run_json"' EXIT
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$CANONICAL_REPOSITORY/actions/runs/$REVIEWED_PLAN_RUN_ID" > "$run_json"
          jq -e --arg repository "$CANONICAL_REPOSITORY" --arg workflow "$PLAN_WORKFLOW_PATH" \
            --arg sha "$REQUEST_EXACT_SHA" --arg run_id "$REVIEWED_PLAN_RUN_ID" \
            '(.id | tostring) == $run_id and .repository.full_name == $repository and
             .head_repository.full_name == $repository and .path == $workflow and
             .event == "workflow_dispatch" and .run_attempt == 1 and
             .status == "completed" and .conclusion == "success" and
             .head_branch == "master" and .head_sha == $sha' "$run_json" >/dev/null || { echo "Reviewed plan run is not exact"; exit 1; }
          reviewed_started_at=$(jq -er '.run_started_at | select(type == "string")' "$run_json")
          reviewed_started_epoch=$(date -u -d "$reviewed_started_at" +%s)
          now_epoch=$(date -u +%s)
          reviewed_age=$((now_epoch - reviewed_started_epoch))
          test "$reviewed_age" -ge 0 -a "$reviewed_age" -lt 86400 || { echo "Reviewed plan run must be less than 24 hours old"; exit 1; }
          rm -f -- "$run_json"
          trap - EXIT
          unset GH_TOKEN reviewed_started_at reviewed_started_epoch now_epoch reviewed_age

          work=$(mktemp -d "$runner_temp/amo-deadletter-apply.XXXXXX")
          payload="$work/payload"
          archive="$work/recovery.tar"
          known_hosts="$work/known_hosts"
          private_key="$work/deploy-key"
          cleanup_runner() {
            rm -f -- "$known_hosts" "$private_key" \
              "$payload/amo-deadletter-group-recovery-core.js" \
              "$payload/inspect-amo-deadletter-group-recovery-plan.js" \
              "$payload/inspect-amo-fixation-lead-reconciliation.js" \
              "$payload/apply-amo-deadletter-group-recovery.js" \
              "$payload/attestation.key" "$payload/manifest" "$archive"
            rmdir -- "$payload" 2>/dev/null || true
            rmdir -- "$work" 2>/dev/null || true
          }
          trap cleanup_runner EXIT
          umask 077
          mkdir -- "$payload"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          printf '%s' "$COHORT_ATTESTATION_KEY" > "$payload/attestation.key"
          unset COHORT_ATTESTATION_KEY
          test "$(wc -c < "$payload/attestation.key")" -ge 32 || { echo "Attestation key too short"; exit 1; }
          key_sha=$(sha256sum -- "$payload/attestation.key" | awk '{print $1}')
          cp -- "$core_path" "$payload/amo-deadletter-group-recovery-core.js"
          cp -- "$plan_path" "$payload/inspect-amo-deadletter-group-recovery-plan.js"
          cp -- "$legacy_path" "$payload/inspect-amo-fixation-lead-reconciliation.js"
          cp -- "$apply_path" "$payload/apply-amo-deadletter-group-recovery.js"
          printf 'source_sha=%s\nreviewed_run_id=%s\ncohort_digest=%s\nexpected_manifest=%s\ncore_sha=%s\nplan_sha=%s\nlegacy_sha=%s\napply_sha=%s\nkey_sha=%s\nqueue_rows=12\nphone_groups=9\nrequeues=0\n' \
            "$REQUEST_EXACT_SHA" "$REVIEWED_PLAN_RUN_ID" "$EXPECTED_COHORT_DIGEST" "$EXPECTED_MANIFEST" \
            "$core_sha" "$plan_sha" "$legacy_sha" "$apply_sha" "$key_sha" > "$payload/manifest"
          chmod 600 "$payload"/*
          tar --format=ustar -C "$payload" -cf "$archive" \
            amo-deadletter-group-recovery-core.js \
            inspect-amo-deadletter-group-recovery-plan.js \
            inspect-amo-fixation-lead-reconciliation.js \
            apply-amo-deadletter-group-recovery.js \
            attestation.key manifest
          archive_sha=$(sha256sum -- "$archive" | awk '{print $1}')

          timeout 15 ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          chmod 600 "$known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#fingerprints[@]}" -eq 1 -a "${fingerprints[0]}" = "$EXPECTED_SSH_FINGERPRINT" || { echo "SSH fingerprint mismatch"; exit 1; }

          {
            cat <<'REMOTE_PREFIX'
          set -euo pipefail
          export LC_ALL=C
          deploy_path=$1
          expected_source_sha=$2
          expected_archive_sha=$3
          canonical_origin=https://github.com/sereganikitin/st-michael-broker-platform.git
          for tool in base64 docker flock git mktemp readlink sed sha256sum tar wc; do
            command -v "$tool" >/dev/null || { echo "Required server tool missing"; exit 1; }
          done
          [[ "$expected_source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          deploy_root=$(readlink -f -- "$deploy_path")
          test -n "$deploy_root" -a "$deploy_root" != / -a -d "$deploy_root"
          test -f /tmp/st-michael-production-deploy.lock -a ! -L /tmp/st-michael-production-deploy.lock
          exec 9</tmp/st-michael-production-deploy.lock
          flock -x -n 9 || { echo "Production lock busy"; exit 1; }
          cd -- "$deploy_root"
          test "$(git rev-parse --show-toplevel)" = "$deploy_root"
          test "$(git remote get-url origin)" = "$canonical_origin"
          test "$(git symbolic-ref --short HEAD)" = master
          test "$(git rev-parse HEAD)" = "$expected_source_sha"
          test "$(git rev-parse refs/heads/master)" = "$expected_source_sha"
          test "$(docker inspect --format '{{.State.Running}}' st-michael-api)" = true
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' st-michael-api)" = api
          test "$(docker exec st-michael-api sh -c 'printf %s "$GIT_SHA"')" = "$expected_source_sha"
          archive=$(mktemp /tmp/amo-deadletter-apply.XXXXXX)
          trap 'rm -f -- "$archive"' EXIT HUP INT TERM
          base64 -d > "$archive" <<'SIGNED_DEADLETTER_APPLY_PAYLOAD'
          REMOTE_PREFIX
            base64 -w 0 -- "$archive"
            printf '\nSIGNED_DEADLETTER_APPLY_PAYLOAD\n'
            cat <<'REMOTE_SUFFIX'
          actual_archive_sha=$(sha256sum "$archive"); actual_archive_sha=${actual_archive_sha%% *}
          test "$actual_archive_sha" = "$expected_archive_sha" || { echo "Archive hash mismatch"; exit 1; }
          mapfile -t entries < <(tar -tf "$archive")
          test "${#entries[@]}" -eq 6
          test "${entries[0]}" = amo-deadletter-group-recovery-core.js
          test "${entries[1]}" = inspect-amo-deadletter-group-recovery-plan.js
          test "${entries[2]}" = inspect-amo-fixation-lead-reconciliation.js
          test "${entries[3]}" = apply-amo-deadletter-group-recovery.js
          test "${entries[4]}" = attestation.key
          test "${entries[5]}" = manifest

          docker exec -i st-michael-api sh -c '
            set -eu
            for tool in cut find mktemp node sed sha256sum tar wc; do command -v "$tool" >/dev/null || exit 1; done
            test -n "${DATABASE_URL:-}"
            test -n "${AMO_ACCESS_TOKEN:-}"
            umask 077
            root=$(mktemp -d /app/scripts/.amo-deadletter-apply.XXXXXX)
            core="$root/amo-deadletter-group-recovery-core.js"
            plan="$root/inspect-amo-deadletter-group-recovery-plan.js"
            legacy="$root/inspect-amo-fixation-lead-reconciliation.js"
            apply="$root/apply-amo-deadletter-group-recovery.js"
            key="$root/attestation.key"
            manifest="$root/manifest"
            cleanup() { rm -f -- "$core" "$plan" "$legacy" "$apply" "$key" "$manifest"; rmdir -- "$root" 2>/dev/null || true; }
            trap cleanup EXIT HUP INT TERM
            tar -xf - -C "$root"
            for file in "$core" "$plan" "$legacy" "$apply" "$key" "$manifest"; do test -f "$file" -a ! -L "$file"; done
            test "$(find "$root" -maxdepth 1 -type f | wc -l)" -eq 6
            test "$(wc -l < "$manifest")" -eq 12
            value() { sed -n "s/^$1=//p" "$manifest"; }
            source_sha=$(value source_sha); reviewed_run_id=$(value reviewed_run_id)
            cohort_digest=$(value cohort_digest); expected_manifest=$(value expected_manifest)
            core_sha=$(value core_sha); plan_sha=$(value plan_sha); legacy_sha=$(value legacy_sha)
            apply_sha=$(value apply_sha); key_sha=$(value key_sha)
            test "$source_sha" = "$GIT_SHA"
            test "$(value queue_rows)" = 12; test "$(value phone_groups)" = 9; test "$(value requeues)" = 0
            test "$(sha256sum "$core" | cut -d" " -f1)" = "$core_sha"
            test "$(sha256sum "$plan" | cut -d" " -f1)" = "$plan_sha"
            test "$(sha256sum "$legacy" | cut -d" " -f1)" = "$legacy_sha"
            test "$(sha256sum "$apply" | cut -d" " -f1)" = "$apply_sha"
            test "$(sha256sum "$key" | cut -d" " -f1)" = "$key_sha"
            test "$(wc -c < "$key")" -ge 32
            export RECOVERY_CONFIRMATION=APPLY_AMO_DEADLETTER_GROUP_RECOVERY
            export RECOVERY_SOURCE_SHA="$source_sha"
            export RECOVERY_CONFIRM_EXACT_SHA="$source_sha"
            export RECOVERY_DEPLOYED_GIT_SHA="$source_sha"
            export RECOVERY_REVIEWED_PLAN_RUN_ID="$reviewed_run_id"
            export RECOVERY_EXPECTED_COHORT_DIGEST="$cohort_digest"
            export RECOVERY_EXPECTED_MANIFEST="$expected_manifest"
            export RECOVERY_CORE_SHA256="$core_sha"
            export RECOVERY_PLAN_SHA256="$plan_sha"
            export RECOVERY_LEGACY_INSPECTOR_SHA256="$legacy_sha"
            export RECOVERY_APPLY_SHA256="$apply_sha"
            export RECOVERY_COHORT_ATTESTATION_KEY_FILE="$key"
            node "$apply"
          ' < "$archive"
          REMOTE_SUFFIX
          } | timeout --foreground 52m ssh -T -i "$private_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$REQUEST_EXACT_SHA' '$archive_sha'"
