name: Inspect Anna base vs ours (read-only)

# 2026-09-07: проверка перед решением о слиянии базы Анны с «Нашей базой»:
# сколько брокеров/агентств Анны совпадает с нашими (по телефону / ИНН /
# названию), сколько только у Анны, сколько только у нас, где дубли.
# Только чтение, в выводе нет телефонов.

on:
  workflow_dispatch: {}

concurrency:
  group: inspect-anna-vs-ours
  cancel-in-progress: false

jobs:
  inspect:
    name: Compare on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and compare
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 8m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            git show origin/master:scripts/inspect-anna-vs-ours.js > /tmp/inspect-anna-vs-ours.js
            git show origin/master:scripts/enrich-agencies-from-amo.js > /tmp/enrich-agencies-from-amo.js
            docker cp /tmp/inspect-anna-vs-ours.js st-michael-api:/app/scripts/inspect-anna-vs-ours.js
            docker cp /tmp/enrich-agencies-from-amo.js st-michael-api:/app/scripts/enrich-agencies-from-amo.js
            docker compose exec -T api node /app/scripts/inspect-anna-vs-ours.js
