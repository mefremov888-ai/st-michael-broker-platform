name: Ops install api autoheal (docker autoheal)

# 2026-09-08 (инцидент 17:25 UTC): api может зависнуть (health отвечает, а
# запросы к БД висят; контейнер unhealthy). Контейнер willfarrell/autoheal
# перезапускает unhealthy-контейнеры (все с healthcheck) раз в 60 с.
# Идемпотентно: старый контейнер autoheal удаляется и ставится заново.

on:
  workflow_dispatch:
    inputs:
      remove:
        description: 'Убрать autoheal (true) вместо установки'
        required: false
        default: false
        type: boolean

concurrency:
  group: ops-install-autoheal
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: SSH and install
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOVE: ${{ inputs.remove }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          envs: REMOVE
          script: |
            set -eu
            docker rm -f st-michael-autoheal >/dev/null 2>&1 || true
            if [ "${REMOVE:-false}" = "true" ]; then echo "autoheal убран"; exit 0; fi
            docker run -d --name st-michael-autoheal --restart=always -e AUTOHEAL_CONTAINER_LABEL=all -e AUTOHEAL_INTERVAL=60 -e AUTOHEAL_START_PERIOD=120 -e AUTOHEAL_DEFAULT_STOP_TIMEOUT=20 -v /var/run/docker.sock:/var/run/docker.sock willfarrell/autoheal:latest
            sleep 5
            docker ps --filter name=st-michael-autoheal --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            echo "api health: $(docker inspect st-michael-api --format '{{.State.Health.Status}}')"
