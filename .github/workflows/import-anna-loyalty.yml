name: Import Anna loyalty snapshot

on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: Exact 40-character production commit SHA
        required: true
        type: string
      expected_payload_sha256:
        description: Exact SHA-256 of the normalized JSON payload
        required: true
        type: string
      chunk_count:
        description: Number of populated ANNA_LOYALTY_PAYLOAD_NN secrets (1..32)
        required: true
        type: string
      confirm_publish:
        description: Publish the validated Anna snapshot to production
        required: true
        default: false
        type: boolean
      confirm_coverage_drop:
        description: Allow a reviewed coverage decrease versus the active Anna snapshot
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Validate and publish Anna snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      MAX_CHUNKS: "32"
      MAX_CHUNK_CHARS: "45000"
      MAX_PAYLOAD_BYTES: "10485760"
      EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
      EXPECTED_PAYLOAD_SHA256: ${{ inputs.expected_payload_sha256 }}
      CHUNK_COUNT: ${{ inputs.chunk_count }}
      CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
      CONFIRM_COVERAGE_DROP: ${{ inputs.confirm_coverage_drop }}
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      EXPECTED_SSH_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
    steps:
      - name: Validate dispatch and create private runner workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_PUBLISH" = "true" || { echo "confirm_publish=true is required"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/master" || { echo "Run this workflow from master"; exit 1; }
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid deployed SHA"; exit 1; }
          test "$EXPECTED_DEPLOYED_SHA" = "$GITHUB_SHA" || { echo "Workflow SHA differs from expected production SHA"; exit 1; }
          [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid payload SHA-256"; exit 1; }
          [[ "$CHUNK_COUNT" =~ ^[0-9]+$ ]] || { echo "Invalid chunk count"; exit 1; }
          test "$CHUNK_COUNT" -ge 1 -a "$CHUNK_COUNT" -le "$MAX_CHUNKS" || { echo "Chunk count is outside the reviewed range"; exit 1; }
          test "$CONFIRM_COVERAGE_DROP" = "true" -o "$CONFIRM_COVERAGE_DROP" = "false" || { echo "Invalid coverage confirmation"; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          root="$RUNNER_TEMP/st-michael-anna-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$root"
          install -m 600 /dev/null "$root/payload.b64"
          echo "ANNA_RUNNER_ROOT=$root" >> "$GITHUB_ENV"
          echo "ANNA_PAYLOAD_B64=$root/payload.b64" >> "$GITHUB_ENV"
          echo "ANNA_PAYLOAD_GZ=$root/payload.json.gz" >> "$GITHUB_ENV"
          echo "ANNA_PAYLOAD_JSON=$root/payload.json" >> "$GITHUB_ENV"
          echo "ANNA_SSH_KEY=$root/deploy-key" >> "$GITHUB_ENV"
          echo "ANNA_KNOWN_HOSTS=$root/known_hosts" >> "$GITHUB_ENV"
          echo "ANNA_REMOTE_DIR=/tmp/st-michael-anna-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Load encrypted-channel chunk 01
        shell: bash
        env:
          PAYLOAD_CHUNK: ${{ secrets.ANNA_LOYALTY_PAYLOAD_01 }}
        run: |
          set -euo pipefail
          if [ "$CHUNK_COUNT" -ge 1 ]; then
            test -n "$PAYLOAD_CHUNK" || { echo "Required payload chunk is missing"; exit 1; }
            test "${#PAYLOAD_CHUNK}" -le "$MAX_CHUNK_CHARS" || { echo "Payload chunk exceeds the reviewed limit"; exit 1; }
            [[ "$PAYLOAD_CHUNK" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "Payload chunk is not base64"; exit 1; }
            printf '%s' "$PAYLOAD_CHUNK" >> "$ANNA_PAYLOAD_B64"
          fi

