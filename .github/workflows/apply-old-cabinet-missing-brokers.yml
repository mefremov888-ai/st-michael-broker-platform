name: Apply old cabinet missing brokers

# 2026-09-17: карточки брокеров, которые подавали заявки в старом кабинете,
# но которых нет ни у нас, ни в справочнике brokers.xlsx. Без них 465 заявок
# из выгрузки не доезжают — импорт пропускает строки, где брокер не найден.
# Источник — сами заявки (data/old-cabinet-fixations.json из data-ветки):
# в каждой строке есть телефон и ФИО подавшего.
#
# Карточки создаются PENDING, без пароля, baseSource = old_cabinet.
# Агентства НЕ создаются и не сводятся. Совпадения по ФИО не склеиваются,
# а показываются списком.
#
# Боевой режим требует dry_run=false И confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      data_branch:
        description: Ветка с data/old-cabinet-fixations.json
        required: true
        default: data/old-cabinet-fixations-20260907
        type: string
      dry_run:
        description: 'Dry-run (только отчёт, ничего не пишется)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись в прод-БД (нужно вместе с dry_run=false)'
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Create broker cards from old cabinet orders
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATA_BRANCH: ${{ inputs.data_branch }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 40m
          envs: DATA_BRANCH,DRY_RUN_INPUT,CONFIRM_APPLY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin "$DATA_BRANCH"
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show "origin/$DATA_BRANCH:data/old-cabinet-fixations.json" > /tmp/old-cabinet-fixations.json
            git show origin/master:scripts/apply-old-cabinet-missing-brokers.js > /tmp/apply-old-cabinet-missing-brokers.js
            docker cp /tmp/old-cabinet-fixations.json st-michael-api:/app/old-cabinet-fixations.json
            docker cp /tmp/apply-old-cabinet-missing-brokers.js st-michael-api:/app/scripts/apply-old-cabinet-missing-brokers.js
            MODE=1
            CONFIRM=0
            if [ "$DRY_RUN_INPUT" = "false" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; CONFIRM=1; fi
            if [ "$MODE" = "1" ]; then echo "=== DRY-RUN (без записи) ==="; else echo "=== APPLY (запись в БД) ==="; fi
            docker compose exec -T -e DRY_RUN=$MODE -e CONFIRM=$CONFIRM api node /app/scripts/apply-old-cabinet-missing-brokers.js /app/old-cabinet-fixations.json
            echo "=== Готово (DRY_RUN=$MODE) ==="
