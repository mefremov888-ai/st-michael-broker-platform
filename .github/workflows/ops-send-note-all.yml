name: Ops note to ALL chats (mine + server-configured)

# Отправка текстовой записки СРАЗУ ВО ВСЕ ops-чаты бота: чат(ы) из серверного
# .env (OPS_ALERT_CHAT_IDS / OPS_ALERT_CHAT_ID — туда сайт шлёт свои алерты)
# плюс чат из GH-секрета OPS_ALERT_CHAT_ID (туда ходят workflow-алерты и PDF).
# Дедуп по chat_id. Ничего на сервере не меняет: .env читается, не пишется.

on:
  workflow_dispatch:
    inputs:
      text:
        description: Текст записки (до ~3500 символов)
        required: true
        type: string

concurrency:
  group: ops-send-note-all
  cancel-in-progress: false

jobs:
  send:
    name: Read server chat ids and fan out the note
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect server-side chat ids
        id: server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            ids=$(grep -hE '^OPS_ALERT_CHAT_IDS?=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' | tr ',; ' '\n' | grep -E '^-?[0-9]+$' | sort -u | tr '\n' ' ')
            echo "SERVER_CHAT_IDS=${ids}"

      - name: Send note to every chat
        shell: bash
        env:
          BOT: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          GH_CHAT: ${{ secrets.OPS_ALERT_CHAT_ID }}
          NOTE: ${{ inputs.text }}
          SERVER_OUT: ${{ steps.server.outputs.stdout || '' }}
        run: |
          set -euo pipefail
          test -n "$BOT" || { echo "нет OPS_TELEGRAM_BOT_TOKEN"; exit 1; }
          server_ids=$(printf '%s\n' "$SERVER_OUT" | grep -oE 'SERVER_CHAT_IDS=.*' | cut -d= -f2- || true)
          all=$(printf '%s %s\n' "$GH_CHAT" "$server_ids" | tr ' ' '\n' | grep -E '^-?[0-9]+$' | sort -u)
          test -n "$all" || { echo "не найдено ни одного chat_id"; exit 1; }
          echo "чатов к отправке: $(echo "$all" | wc -l)"
          fail=0
          for chat in $all; do
            ok=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
              --data-urlencode chat_id="$chat" \
              --data-urlencode text="$NOTE" | head -c 200)
            case "$ok" in
              '{"ok":true'*) echo "chat ${chat:0:4}***: отправлено" ;;
              *) echo "chat ${chat:0:4}***: ОШИБКА: $ok"; fail=1 ;;
            esac
          done
          exit $fail
