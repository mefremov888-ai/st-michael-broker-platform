name: Ops note to ALL chats (mine + server-configured)

# Отправка текстовой записки во все ops-чаты бота: чаты из серверного .env
# (OPS_ALERT_CHAT_IDS / OPS_ALERT_CHAT_ID) + чат из GH-секрета OPS_ALERT_CHAT_ID.
# Всё в одном ssh-шаге (v2: appleboy/ssh-action не передаёт stdout между шагами),
# отправка curl-ом прямо с сервера. Дедуп chat_id. .env читается, не пишется.
#
# send_to=server_only досылает только в серверные чаты (GH-чат уже уведомлён).

on:
  workflow_dispatch:
    inputs:
      text:
        description: Текст записки (до ~3500 символов)
        required: true
        type: string
      send_to:
        description: Куда слать — all | server_only (без GH-чата) | gh_only
        required: false
        default: all
        type: string

concurrency:
  group: ops-send-note-all
  cancel-in-progress: false

jobs:
  send:
    name: Merge chat ids on server and fan out the note
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH, merge ids, send
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          BOT: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          GH_CHAT: ${{ secrets.OPS_ALERT_CHAT_ID }}
          NOTE: ${{ inputs.text }}
          SEND_TO: ${{ inputs.send_to }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 3m
          envs: BOT,GH_CHAT,NOTE,SEND_TO
          script: |
            set -eu
            test -n "$BOT" || { echo "нет OPS_TELEGRAM_BOT_TOKEN"; exit 1; }
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "env-файлы в рабочей папке:"
            ls -la .env* 2>/dev/null || echo "(нет .env файлов)"
            echo "строки OPS_ALERT в env-файлах (значения замаскированы):"
            grep -hE 'OPS_ALERT' .env .env.* 2>/dev/null | sed 's/=.*/=***/' || echo "(совпадений нет)"
            server_ids=$(grep -hE 'OPS_ALERT_CHAT_IDS?=' .env 2>/dev/null | sed -e 's/^[^=]*=//' -e "s/[\"']//g" -e 's/\r//g' | tr ',;' '\n' | tr -d ' \t' | grep -E '^-?[0-9]+$' || true)
            echo "распознано серверных chat_id: $(printf '%s\n' "$server_ids" | grep -c . || true)"
            echo "длины распознанных id (без значений):"
            printf '%s\n' "$server_ids" | awk '{print length($0)}' || true
            # 2026-09-08: ветка all падала молча под set -e; собираем список без ветвлений.
            gh_part=""; srv_part=""
            [ "${SEND_TO:-all}" != "server_only" ] && gh_part="$GH_CHAT" || true
            [ "${SEND_TO:-all}" != "gh_only" ] && srv_part="$server_ids" || true
            all=$(printf '%s\n%s\n' "$gh_part" "$srv_part" | grep -E '^-?[0-9]+$' | sort -u || true)
            test -n "$all" || { echo "не найдено ни одного chat_id к отправке"; exit 1; }
            echo "чатов к отправке: $(printf '%s\n' "$all" | wc -l)"
            fail=0
            for chat in $all; do
              ok=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
                --data-urlencode chat_id="$chat" \
                --data-urlencode text="$NOTE" | head -c 120)
              tail4=$(printf '%s' "$chat" | tail -c 4)
              if printf '%s' "$ok" | grep -q '"ok":true'; then
                echo "chat ...$tail4: отправлено"
              else
                echo "chat ...$tail4: ОШИБКА: $ok"
                fail=1
              fi
            done
            exit $fail
