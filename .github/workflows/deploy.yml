name: Deploy to production

# Триггеры:
# Push в master запускает обязательную сборку/тесты, но production deployment
# выполняется только вручную с явным подтверждением. Это особенно важно для
# первого migration-aware релиза и legacy Prisma baseline.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: I completed backup, clone rehearsal and production DB identity checks
        required: true
        default: false
        type: boolean

concurrency:
  # Гарантирует, что одновременно идёт не более одного деплоя.
  # Если приходит новый push пока идёт предыдущий — старый отменяется.
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and test release commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prisma generate only needs a syntactically valid URL in CI; this address
      # is deliberately non-routable and is never used for a database connection.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci?connect_timeout=1
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build all workspaces
        run: npm run build

      - name: Run test suites
        run: npm test --workspace=@st-michael/api -- --runInBand

      - name: Run web contract tests
        run: npm test --workspace=@st-michael/web

  deploy:
    name: SSH deploy to production
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Configure required reviewers and prevent self-approval for this
    # environment in GitHub Settings before the first migration-aware release.
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        # 2026-05-27 fix: env-секция обязательна, иначе envs: передаёт пустоту.
        # 2026-06-05: добавлены AMO_CLIENT_ID / AMO_CLIENT_SECRET / AMO_REFRESH_TOKEN —
        # нужны для авто-refresh access_token (см. PR #82).
        env:
          AMO_ACCESS_TOKEN: ${{ secrets.AMO_ACCESS_TOKEN }}
          AMO_CLIENT_ID: ${{ secrets.AMO_CLIENT_ID }}
          AMO_CLIENT_SECRET: ${{ secrets.AMO_CLIENT_SECRET }}
          AMO_REFRESH_TOKEN: ${{ secrets.AMO_REFRESH_TOKEN }}
          MANGO_API_KEY: ${{ secrets.MANGO_API_KEY }}
          MANGO_API_SALT: ${{ secrets.MANGO_API_SALT }}
          MANGO_API_URL: ${{ secrets.MANGO_API_URL }}
          MANGO_CALLBACK_URL: ${{ secrets.MANGO_CALLBACK_URL }}
          MANGO_OUTBOUND_LINE: ${{ secrets.MANGO_OUTBOUND_LINE }}
          # 2026-06-09: SMTP для welcome-email при регистрации брокера +
          # forgotPassword. mail.stmichael.ru:587 (STARTTLS).
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          # 2026-06-26: Dadata Suggestions API — автодополнение ИНН на форме регистрации.
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
          # 2026-07-07: Anthropic API — классификация специализации брокеров
          # через Claude (batch-скрипт classify-brokers-specialization.js).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 2026-07-09: Google Service Account JSON — ключ авторизации для
          # ночного синка брокеров из Google Sheets (см.
          # scripts/import-brokers-from-gsheet.js). До этого секрет
          # руками клался на сервер и терялся при перезапусках.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 2026-08-18: бот для технических алертов (amoCRM/SMTP/диск и т.д.),
          # см. scheduler.service.ts alertAmoDown/alertAmoTokenDead/alertSmtpDown.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPS_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          OPS_ALERT_CHAT_ID: ${{ secrets.OPS_ALERT_CHAT_ID }}
          OPS_ALERT_CHAT_IDS: ${{ secrets.OPS_ALERT_CHAT_IDS }}
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
          PRODUCTION_PG_SYSTEM_IDENTIFIER: ${{ vars.PRODUCTION_PG_SYSTEM_IDENTIFIER }}
          PRODUCTION_MIN_BROKER_ROWS: ${{ vars.PRODUCTION_MIN_BROKER_ROWS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 75m
          # AMO_* из GH secrets автоматически в .env на сервере.
          # Чтобы обновить токен: gh secret set AMO_* ... + push.
          # ВАЖНО: refresh_token ротируется на каждом использовании.
          # На сервере приоритет у БД (SystemSetting) — деплой пишет в .env
          # как fallback. См. apps/api/src/common/amo-token-bootstrap.service.ts.
          envs: AMO_ACCESS_TOKEN,AMO_CLIENT_ID,AMO_CLIENT_SECRET,AMO_REFRESH_TOKEN,MANGO_API_KEY,MANGO_API_SALT,MANGO_API_URL,MANGO_CALLBACK_URL,MANGO_OUTBOUND_LINE,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,SMTP_SECURE,DADATA_API_KEY,ANTHROPIC_API_KEY,GOOGLE_SERVICE_ACCOUNT_JSON,TELEGRAM_BOT_TOKEN,OPS_TELEGRAM_BOT_TOKEN,OPS_ALERT_CHAT_ID,OPS_ALERT_CHAT_IDS,EXPECTED_DEPLOY_SHA,PRODUCTION_PG_SYSTEM_IDENTIFIER,PRODUCTION_MIN_BROKER_ROWS,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            command -v git >/dev/null
            command -v flock >/dev/null
            command -v mktemp >/dev/null
            command -v grep >/dev/null
            printf '%s' "$EXPECTED_DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "Invalid EXPECTED_DEPLOY_SHA"; exit 1; }
            exec 8>/tmp/st-michael-production-deploy.lock
            flock -n 8 || { echo "Another production deploy holds the server lock"; exit 1; }
            TRUSTED_REPOSITORY="https://github.com/sereganikitin/st-michael-broker-platform.git"
            git fetch "$TRUSTED_REPOSITORY" master
            TRUSTED_SHA=$(git rev-parse FETCH_HEAD)
            if [ "$TRUSTED_SHA" != "$EXPECTED_DEPLOY_SHA" ]; then
              echo "Production master changed after this workflow started; rerun for the current SHA."
              exit 1
            fi
            TRUSTED_DEPLOY_SCRIPT=$(mktemp /tmp/st-michael-deploy-script.XXXXXX)
            cleanup_bootstrap() { rm -f -- "$TRUSTED_DEPLOY_SCRIPT"; }
            trap cleanup_bootstrap EXIT
            git show "$EXPECTED_DEPLOY_SHA:deploy-update.sh" > "$TRUSTED_DEPLOY_SCRIPT"
            chmod 700 "$TRUSTED_DEPLOY_SCRIPT"
            echo "=== Запуск reviewed deploy-update.sh exact SHA ==="
            DEPLOY_REPO_DIR="$PWD" DEPLOY_LOCK_HELD=1 bash "$TRUSTED_DEPLOY_SCRIPT"
            echo "=== Деплой завершён успешно ==="
