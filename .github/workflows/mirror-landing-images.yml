name: Mirror landing images
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только проверка)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю скачивание и перезапись ссылок'
        required: true
        default: false
        type: boolean
concurrency:
  group: mirror-landing-images
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  apply:
    name: Run on production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 25m
          envs: DRY_RUN_INPUT,CONFIRM_APPLY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show origin/master:scripts/apply-mirror-landing-images.js > /tmp/apply-mirror-landing-images.js
            docker cp /tmp/apply-mirror-landing-images.js st-michael-api:/app/scripts/apply-mirror-landing-images.js
            MODE=1
            CONFIRM=0
            if [ "$DRY_RUN_INPUT" = "false" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; CONFIRM=1; fi
            docker compose exec -T -e DRY_RUN=$MODE -e CONFIRM=$CONFIRM api node /app/scripts/apply-mirror-landing-images.js
            echo "=== Готово (DRY_RUN=$MODE) ==="
