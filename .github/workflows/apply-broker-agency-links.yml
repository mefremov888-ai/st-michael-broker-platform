name: Apply broker-agency links (old cabinet)

# 2026-09-07: массовая привязка брокеров к карточкам агентств по данным
# старого кабинета (2 325 брокеров с текстовым названием агентства).
# Данные лежат в data-ветке (data/broker-agency-links.json: brokerPhone
# нормализован до +7..., agencyKey — canonicalAgencyMatchKey названия,
# строки без телефона/агентства и «тест» отброшены при подготовке),
# скрипт — в master (scripts/link-brokers-to-agencies.js). Только создаёт
# недостающие связи BrokerAgency (дедуп по (brokerId, agencyId)),
# НИЧЕГО не обновляет и не удаляет.
#
# Боевой режим требует dry_run=false И confirm_apply=true — любая другая
# комбинация выполняется как dry-run (только отчёт, без записи).
#
# Запуск: Actions → "Apply broker-agency links (old cabinet)" → Run workflow
# (сначала dry_run=true, проверить счётчики и топ-15 в логе,
# затем dry_run=false + confirm_apply=true).

on:
  workflow_dispatch:
    inputs:
      data_branch:
        description: Branch with data/broker-agency-links.json
        required: true
        default: data/broker-agency-links-20260907
        type: string
      dry_run:
        description: 'Dry-run (только отчёт, ничего не пишется)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись в прод-БД (нужно вместе с dry_run=false)'
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  link:
    name: Link brokers to agencies on production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH and run linking
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATA_BRANCH: ${{ inputs.data_branch }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          envs: DATA_BRANCH,DRY_RUN_INPUT,CONFIRM_APPLY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin "$DATA_BRANCH"
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show "origin/$DATA_BRANCH:data/broker-agency-links.json" > /tmp/broker-agency-links.json
            git show origin/master:scripts/link-brokers-to-agencies.js > /tmp/link-brokers-to-agencies.js
            docker cp /tmp/broker-agency-links.json st-michael-api:/app/broker-agency-links.json
            docker cp /tmp/link-brokers-to-agencies.js st-michael-api:/app/scripts/link-brokers-to-agencies.js
            MODE=1
            if [ "$DRY_RUN_INPUT" = "false" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; fi
            if [ "$MODE" = "1" ]; then echo "=== DRY-RUN (без записи) ==="; else echo "=== APPLY (запись в БД) ==="; fi
            docker compose exec -T -e DRY_RUN=$MODE api node /app/scripts/link-brokers-to-agencies.js /app/broker-agency-links.json
            echo "=== Готово (DRY_RUN=$MODE) ==="
