name: Apply registry commission fact

# 2026-09-14 (решение владельца): переносим в базу факт комиссии из
# Google-листа — начисленную сумму, отметку о выплате и источник лида —
# рядом с расчётом кабинета, чтобы их наконец можно было сверять.
# Колонка процента смешанная (в 874 строках там источник лида, а не
# ставка), поэтому сохраняется текстом и ставкой не считается.
# Обновляются только существующие строки реестра, ничего не создаётся.
#
# Боевой режим требует dry_run=false И confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только отчёт, ничего не пишется)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю запись в прод-БД (нужно вместе с dry_run=false)'
        required: true
        default: false
        type: boolean

concurrency:
  group: apply-registry-commission-fact
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Import commission fact from sheet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 40m
          envs: DRY_RUN_INPUT,CONFIRM_APPLY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            echo "=== Скрипт из origin/master: $(git rev-parse --short origin/master) ==="
            git show origin/master:scripts/apply-registry-commission-fact.js > /tmp/apply-registry-commission-fact.js
            docker cp /tmp/apply-registry-commission-fact.js st-michael-api:/app/scripts/apply-registry-commission-fact.js
            MODE=1
            CONFIRM=0
            if [ "$DRY_RUN_INPUT" = "false" ] && [ "$CONFIRM_APPLY" = "true" ]; then MODE=0; CONFIRM=1; fi
            if [ "$MODE" = "1" ]; then echo "=== DRY-RUN (без записи) ==="; else echo "=== APPLY (запись в БД) ==="; fi
            docker compose exec -T -e DRY_RUN=$MODE -e CONFIRM=$CONFIRM api node /app/scripts/apply-registry-commission-fact.js
            echo "=== Готово (DRY_RUN=$MODE) ==="
