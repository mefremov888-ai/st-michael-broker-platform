name: Inspect Telegram bot chats (news channel id)

# 2026-09-29: ручной запуск из Actions UI. Печатает, какой бот стоит за
# токеном, нет ли на нём webhook, какие каналы/чаты бот видел (в том числе
# последний канал, увиденный приёмом новостей, — так узнаём chat.id закрытого
# канала для настройки TELEGRAM_NEWS_CHAT_ID). Только чтение, токен не печатается.
# См. docs/telegram-news.md.

on:
  workflow_dispatch:

concurrency:
  group: inspect-telegram-bot-chats
  cancel-in-progress: false

jobs:
  inspect:
    name: Run inspector on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and run inspector
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose exec -T api node /app/scripts/inspect-telegram-bot-chats.js
