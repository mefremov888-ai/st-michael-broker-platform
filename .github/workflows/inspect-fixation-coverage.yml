name: Inspect fixation coverage (read-only)

# 2026-09-07: контрольные цифры по фиксациям до/после массовых операций
# (импорт старого кабинета, склейки). Только чтение, только агрегаты.

on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    name: Count fixations on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and count
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 8m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            git show origin/master:scripts/inspect-fixation-coverage.js > /tmp/inspect-fixation-coverage.js
            docker cp /tmp/inspect-fixation-coverage.js st-michael-api:/app/scripts/inspect-fixation-coverage.js
            docker compose exec -T api node /app/scripts/inspect-fixation-coverage.js
