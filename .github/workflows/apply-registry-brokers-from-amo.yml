name: Apply brokers from registry amo contacts

# 2026-09-08 (решение владельца): завести карточки брокеров по amo-контактам
# из строк «Реестра сделок» без брокера (сопоставление по телефону, иначе
# новая карточка PENDING без аккаунта) и разнести по ним договоры.
# По умолчанию dry-run; запись — dry_run=false + confirm_apply=true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только отчёт)'
        required: true
        default: true
        type: boolean
      confirm_apply:
        description: 'Подтверждаю создание карточек и привязку (нужно вместе с dry_run=false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  apply:
    name: Run on production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: SSH and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_INPUT: ${{ inputs.dry_run }}
          CONFIRM_INPUT: ${{ inputs.confirm_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 22m
          envs: DRY_INPUT,CONFIRM_INPUT
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin master
            for f in create-brokers-from-registry-contacts.js link-brokers-to-agencies-from-amo.js enrich-agencies-from-amo.js; do
              git show origin/master:scripts/$f > /tmp/$f
              docker cp /tmp/$f st-michael-api:/app/scripts/$f
            done
            DRY=1
            if [ "$DRY_INPUT" = "false" ]; then
              if [ "$CONFIRM_INPUT" != "true" ]; then echo "dry_run=false требует confirm_apply=true"; exit 1; fi
              DRY=0
            fi
            docker compose exec -T -e DRY_RUN=$DRY api node /app/scripts/create-brokers-from-registry-contacts.js
